<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="assets/icono.svg" type="image/svg+xml">
<link rel="icon" href="assets/icono-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="assets/icono-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c9a2ff">
<title>Lola y la Luna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: an open picture book — illustrated scene on top, big tappable words underneath, page arrows at the bottom. */
:root {
  --cover: #2b4c8c;
  --page: #fffdf7;
  --ink: #23324a;
  --hi: #ffe27a;
  --shadow: rgba(35, 50, 74, .28);
  --go: #3f8ee8;
  --font-display: "Baloo 2", "Comic Sans MS", system-ui, sans-serif;
  --font-letters: "Andika", "Century Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { min-height: 100%; margin: 0; }
body { background-attachment: fixed; }
body { background: radial-gradient(circle at 50% 0%, #3c64b0, var(--cover) 70%); color: var(--ink); font-family: var(--font-display); -webkit-tap-highlight-color: transparent; }
.page { min-height: 100%; box-sizing: border-box; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; padding-inline: 16px; padding-block: calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-bottom, 0px) + 14px); }
button, a.btn { font: inherit; color: inherit; border: 0; cursor: pointer; text-decoration: none; }
button:focus-visible, a:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }

.bar { display: flex; align-items: center; gap: 10px; }
.bar h1 { margin: 0 auto 0 4px; color: #fff; font-size: clamp(24px, 6.5vw, 34px); line-height: 1; font-weight: 800; }
.round-btn { flex: none; width: 50px; height: 50px; border-radius: 50%; background: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.25); font-size: 24px; display: grid; place-items: center; }
.round-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }

.libro { background: var(--page); border-radius: 28px; box-shadow: 0 10px 0 rgba(0,0,0,.25); overflow: hidden; display: flex; flex-direction: column; flex: 1; }
.escena { position: relative; flex: 1; min-height: 220px; max-width: 100%; overflow: hidden; transition: background 1s; }
.escena .e { position: absolute; transform: translate(-50%, -50%); line-height: 1; }
.texto { padding: 18px 20px 20px; font-family: var(--font-letters); font-weight: 700; font-size: clamp(28px, 7vw, 42px); line-height: 1.45; text-wrap: pretty; min-height: 3em; }
.texto .w { border-radius: 10px; padding: 0 3px; cursor: pointer; transition: background .15s; }
.texto .w.hi { background: var(--hi); box-shadow: 0 0 0 3px var(--hi); }

.nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.flecha { width: 76px; height: 64px; border-radius: 22px; background: #fff; font-size: 34px; box-shadow: 0 5px 0 rgba(0,0,0,.25); display: grid; place-items: center; }
.flecha:disabled { opacity: .35; cursor: default; }
.flecha:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.leer { background: var(--hi); border-radius: 999px; padding: 10px 22px; font-size: 22px; font-weight: 800; box-shadow: 0 5px 0 #c9a82e; }
.leer:active { transform: translateY(4px); box-shadow: 0 1px 0 #c9a82e; }
.puntos { display: flex; justify-content: center; gap: 8px; }
.punto { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.35); }
.punto.on { background: #fff; }

/* animaciones de la escena */
.flota { animation: flota 3s ease-in-out infinite; }
.salta { animation: salta .9s ease-in-out infinite; }
.brilla { animation: brilla 2s ease-in-out infinite; }
.vuela { animation: vuela 4s ease-in-out infinite; }
.gira { animation: gira 6s linear infinite; }
@keyframes flota { 0%,100% { transform: translate(-50%, -50%) } 50% { transform: translate(-50%, -58%) } }
@keyframes salta { 0%,100% { transform: translate(-50%, -50%) } 45% { transform: translate(-50%, -95%) } }
@keyframes brilla { 0%,100% { filter: drop-shadow(0 0 6px #fff6b0); transform: translate(-50%,-50%) scale(1) } 50% { filter: drop-shadow(0 0 22px #fff6b0); transform: translate(-50%,-50%) scale(1.08) } }
@keyframes vuela { 0%,100% { transform: translate(-50%, -50%) rotate(-6deg) } 50% { transform: translate(-30%, -70%) rotate(6deg) } }
@keyframes gira { to { transform: translate(-50%, -50%) rotate(360deg) } }
/* biblioteca */
.biblio { display: flex; flex-direction: column; gap: 14px; }
.biblio h2 { margin: 6px 0 0; color: #fff; font-size: 24px; }
.estantes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.tapa { position: relative; border-radius: 22px; padding: 14px 10px 12px; background: linear-gradient(160deg, #fff, #ffe9f6); box-shadow: 0 6px 0 rgba(0,0,0,.25); display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 18px; font-weight: 800; line-height: 1.1; min-height: 150px; justify-content: center; }
.tapa .em { font-size: 54px; line-height: 1; }
.tapa:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.tapa .tag { position: absolute; top: 8px; right: 8px; font-size: 13px; background: #9a6ee0; color: #fff; border-radius: 999px; padding: 1px 8px; }
.tapa.bloq { background: linear-gradient(160deg, #eef0f6, #dfe3ee); color: #5b6b82; }
.tapa.bloq .em { filter: grayscale(.6); opacity: .7; }
.tapa.magia { background: linear-gradient(160deg, #ffe27a, #ff9ad5); }
.tapa .quitar { position: absolute; top: 6px; left: 6px; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.85); font-size: 15px; }
.nota { color: #dfe8ff; font-family: system-ui, sans-serif; font-size: 15px; margin: 0; }
.ia-form { background: #fff; border-radius: 24px; padding: 16px; box-shadow: 0 6px 0 rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 10px; }
.ia-form h3 { margin: 0; font-size: 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border-radius: 999px; padding: 6px 14px; background: #eef0f6; font-size: 18px; font-weight: 800; }
.chip.on { background: var(--hi); box-shadow: 0 3px 0 #c9a82e; }
.ia-form input { font: inherit; font-size: 18px; padding: 8px 12px; border-radius: 14px; border: 2px solid #e4e0f0; }
.ia-msg { min-height: 1.3em; font-weight: 800; }
.moraleja { margin: 0 20px 18px; padding: 10px 14px; border-radius: 16px; background: #fff3c4; font-family: var(--font-letters); font-size: clamp(20px, 5vw, 26px); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<script src="js/comun.js"></script>
<script src="js/tema.js"></script>
<script src="js/cuenta.js"></script>
</head>
<body>
<div class="page">
  <div class="bar">
    <a class="round-btn btn" href="index.html" aria-label="Volver al inicio" id="casa">🏠</a>
    <button class="round-btn" id="a-biblio" aria-label="Volver a la biblioteca" hidden>📚</button>
    <h1 id="titulo">Biblioteca</h1>
    <button class="round-btn" data-musica aria-label="Música">🎵</button>
  </div>

  <section class="biblio" id="biblio" aria-label="Biblioteca de cuentos">
    <div class="estantes" id="estantes"></div>
    <h2 id="mis-titulo" hidden>✨ Mis cuentos con nombres</h2>
    <div class="estantes" id="mis"></div>
    <p class="nota" id="nota"></p>
    <form class="ia-form" id="ia-form" hidden>
      <h3>✨ Cuento con nuestros nombres</h3>
      <div><b>¿Quiénes salen en el cuento?</b><div class="chips" id="nombres"></div></div>
      <input id="otro" placeholder="Otro nombre (opcional)" maxlength="20" aria-label="Otro nombre">
      <div><b>¿De qué trata?</b><div class="chips" id="temas"></div></div>
      <button class="leer" type="submit" id="crear">✨ Crear el cuento</button>
      <div class="ia-msg" id="ia-msg" role="status"></div>
    </form>
  </section>

  <article class="libro" id="libro" hidden>
    <div class="escena" id="escena" aria-hidden="true"></div>
    <p class="texto" id="texto"></p>
    <p class="moraleja" id="moraleja" hidden></p>
  </article>

  <div class="nav" id="nav" hidden>
    <button class="flecha" id="atras" aria-label="Página anterior">⬅️</button>
    <button class="leer" id="leer">🔊 Leer</button>
    <button class="flecha" id="adelante" aria-label="Página siguiente">➡️</button>
  </div>
  <div class="puntos" id="puntos" hidden></div>
</div>

<script>
(() => {
  const J = window.Juego;
  const $ = s => document.querySelector(s);

  const DIA = 'linear-gradient(#8fd6f8, #c9efff 60%, #8fd46a 60%)';
  const NOCHE = 'linear-gradient(#1d2b5c, #3a4d8f 62%, #2f6b4a 62%)';
  const CIELO = 'linear-gradient(#ffd6e8, #c7e6ff)';
  const CIELO_NOCHE = 'linear-gradient(#141e45, #34407a)';
  const CASA = 'linear-gradient(#ffcf9e, #ffe9cf 62%, #8fd46a 62%)';
  const CUARTO = 'linear-gradient(#2a2f62, #4a4f8f)';

  // [emoji, x%, y%, tamaño en % del ancho, animación]
  const LOLA = [
    { bg: DIA, text: 'Esta es Lola. Lola es una zorrita.',
      s: [['🌳', 14, 46, 22], ['🦊', 50, 66, 20, 'salta'], ['🌳', 86, 44, 24], ['🌼', 30, 82, 7], ['🌼', 70, 84, 6], ['☀️', 82, 14, 12, 'gira']] },
    { bg: NOCHE, text: 'Lola mira la luna. ¡Qué linda es la luna!',
      s: [['🌙', 72, 24, 18, 'brilla'], ['✨', 40, 16, 6, 'brilla'], ['⭐', 18, 22, 5, 'brilla'], ['⭐', 88, 50, 4, 'brilla'], ['🦊', 32, 70, 18], ['🌲', 82, 66, 16]] },
    { bg: NOCHE, text: 'Lola salta y salta. ¡Quiere tocar la luna!',
      s: [['🌙', 78, 20, 14, 'brilla'], ['🦊', 42, 66, 18, 'salta'], ['⭐', 20, 18, 5, 'brilla'], ['✨', 60, 30, 5, 'brilla']] },
    { bg: CIELO, text: 'Una nube baja. Lola sube a la nube.',
      s: [['☁️', 48, 62, 44, 'flota'], ['🦊', 48, 44, 15, 'flota'], ['☁️', 14, 22, 14, 'flota'], ['☁️', 86, 18, 12, 'flota']] },
    { bg: CIELO, text: 'En el cielo hay un pato. —Hola, pato —dice Lola.',
      s: [['☁️', 34, 66, 40, 'flota'], ['🦊', 34, 48, 14, 'flota'], ['🦆', 74, 36, 17, 'vuela'], ['💬', 56, 22, 10]] },
    { bg: CIELO_NOCHE, text: 'El pato y Lola van a la luna.',
      s: [['🌙', 80, 30, 26, 'brilla'], ['🦆', 30, 52, 15, 'vuela'], ['🦊', 44, 60, 13, 'vuela'], ['⭐', 12, 18, 5, 'brilla'], ['⭐', 56, 14, 4, 'brilla'], ['⭐', 20, 84, 4, 'brilla']] },
    { bg: CIELO_NOCHE, text: 'La luna sonríe: —Hola, Lola. Toma una estrella.',
      s: [['🌝', 64, 42, 34, 'brilla'], ['🦊', 22, 62, 15], ['⭐', 40, 50, 9, 'gira'], ['✨', 86, 16, 6, 'brilla']] },
    { bg: CASA, text: 'Lola vuelve a su casa. Mamá le da un beso.',
      s: [['🏠', 26, 50, 32], ['🦊', 64, 66, 22], ['🦊', 80, 70, 14, 'salta'], ['💖', 72, 36, 9, 'flota'], ['⭐', 80, 54, 6, 'brilla']] },
    { bg: CUARTO, text: 'Lola duerme y sueña con la luna. ¡Fin!',
      s: [['🛏️', 46, 66, 34], ['🦊', 40, 54, 12], ['💤', 58, 34, 9, 'flota'], ['🌙', 84, 18, 13, 'brilla'], ['⭐', 14, 16, 5, 'brilla'], ['⭐', 26, 30, 4, 'brilla']] },
  ];

  const FONDOS = { dia: DIA, noche: NOCHE, cielo: CIELO, cielonoche: CIELO_NOCHE, casa: CASA, cuarto: CUARTO,
    campo: 'linear-gradient(#bfe9ff, #e8f8ff 58%, #9ad86e 58%)', invierno: 'linear-gradient(#cfe3f5, #f3f8ff 60%, #ffffff 60%)',
    bosque: 'linear-gradient(#a9dbc1, #dff3e6 60%, #6fbf73 60%)', mar: 'linear-gradient(#8fd6f8, #c9efff 55%, #3fa3d9 55%)' };
  // fábulas de Esopo (dominio público) contadas con palabras nuestras, en frases cortitas para leer
  const FABULAS = [
    { id: 'liebre-tortuga', titulo: 'La liebre y la tortuga', emoji: '🐢', paginas: [
      { texto: 'Esta es Tita, la tortuga. Tita camina despacito.', dibujo: '🐢 🌼 🌳', fondo: 'campo' },
      { texto: 'Esta es Lía, la liebre. Lía corre muy rápido.', dibujo: '🐇 💨 🌷', fondo: 'campo' },
      { texto: '—Tita, ¿hacemos una carrera? —dice Lía.', dibujo: '🐇 🐢 💬', fondo: 'campo' },
      { texto: '¡Ya! Lía corre y corre. Tita camina paso a paso.', dibujo: '🐇 🐢 🏁', fondo: 'campo' },
      { texto: 'Lía mira atrás. Tita está lejos. Lía se echa a dormir.', dibujo: '🐇 💤 🌳', fondo: 'campo' },
      { texto: 'Tita no para. Paso a paso, pasa junto a Lía.', dibujo: '🐢 🐇 💤', fondo: 'campo' },
      { texto: '¡Tita llega a la meta! Lía despierta. ¡Uy!', dibujo: '🐢 🏁 🎉 🐇', fondo: 'campo' },
      { texto: 'Despacito y sin parar, también se puede ganar. ¡Fin!', dibujo: '🐢 ⭐ 🌈', fondo: 'dia' },
    ], moraleja: 'Despacito y sin parar, también se puede ganar.' },
    { id: 'leon-raton', titulo: 'El león y el ratón', emoji: '🦁', paginas: [
      { texto: 'Este es Leo, el león. Leo duerme bajo un árbol.', dibujo: '🦁 💤 🌳', fondo: 'bosque' },
      { texto: 'Un ratón pasa y sube por su cola. ¡Uy!', dibujo: '🐭 🦁 🌿', fondo: 'bosque' },
      { texto: 'Leo despierta y lo atrapa. —¡No me comas! —dice el ratón.', dibujo: '🦁 🐭 💬', fondo: 'bosque' },
      { texto: '—Un día te voy a ayudar. Leo se ríe y lo suelta.', dibujo: '🦁 😄 🐭', fondo: 'bosque' },
      { texto: 'Otro día, Leo cae en una red. ¡No puede salir!', dibujo: '🦁 🕸️ 😢', fondo: 'bosque' },
      { texto: 'El ratón oye a Leo y corre a ayudar.', dibujo: '🐭 💨 🌳', fondo: 'bosque' },
      { texto: 'Con sus dientes, el ratón corta la red. ¡Leo sale!', dibujo: '🐭 🕸️ 🦁 ✨', fondo: 'bosque' },
      { texto: 'Leo y el ratón son amigos. ¡Los chicos también ayudan! ¡Fin!', dibujo: '🦁 🐭 💖', fondo: 'dia' },
    ], moraleja: 'Todos, grandes y chicos, podemos ayudar.' },
    { id: 'cigarra-hormiga', titulo: 'La cigarra y la hormiga', emoji: '🐜', paginas: [
      { texto: 'Es verano. Hace sol y calor.', dibujo: '☀️ 🌻 🌾', fondo: 'campo' },
      { texto: 'La cigarra canta y canta todo el día.', dibujo: '🦗 🎵 🌻', fondo: 'campo' },
      { texto: 'La hormiga lleva comida a su casa. Sube y baja sin parar.', dibujo: '🐜 🌽 🏠', fondo: 'campo' },
      { texto: '—Ven a cantar —dice la cigarra. —Ahora no, guardo comida —dice la hormiga.', dibujo: '🦗 🐜 💬', fondo: 'campo' },
      { texto: 'Llega el invierno. Hace frío y cae nieve.', dibujo: '⛄ ❄️ 🌨️', fondo: 'invierno' },
      { texto: 'La cigarra tiene frío y hambre. Toca la puerta de la hormiga.', dibujo: '🦗 🥶 🚪', fondo: 'invierno' },
      { texto: 'La hormiga le da sopa y una manta. ¡Qué rica sopa!', dibujo: '🐜 🍲 🦗', fondo: 'casa' },
      { texto: 'La cigarra aprende: primero se trabaja y luego se canta. ¡Fin!', dibujo: '🦗 🐜 🎶', fondo: 'casa' },
    ], moraleja: 'Primero se trabaja y luego se canta.' },
  ];
  // dibujo "🐢 🌼 🌳": el primero es el protagonista, grande; los demás alrededor
  const POS = [[46, 64, 24, 'salta'], [76, 40, 16, 'flota'], [20, 38, 15, 'flota'], [82, 74, 12], [16, 76, 10], [56, 22, 9, 'brilla']];
  function escenaDe(pg) {
    if (pg.s) return pg;
    const em = String(pg.dibujo || '📖').trim().split(/\s+/).slice(0, 6);
    return { bg: FONDOS[pg.fondo] || (/[🌙⭐]/u.test(pg.dibujo || '') ? NOCHE : DIA), text: pg.texto, s: em.map((e, i) => [e, ...POS[i]]) };
  }
  const leerLocal = () => { try { return JSON.parse(localStorage.getItem('bl-cuentos-ia') || '[]'); } catch (e) { return []; } };
  const guardarLocal = l => { try { localStorage.setItem('bl-cuentos-ia', JSON.stringify(l.slice(0, 30))); } catch (e) {} };

  let PAGES = LOLA, cuento = null, page = 0, words = [], started = false;

  function render() {
    const pg = PAGES[page];
    $('#moraleja').hidden = !(cuento && cuento.moraleja && page === PAGES.length - 1 && !pg.text.includes(cuento.moraleja));
    if (cuento && cuento.moraleja) $('#moraleja').textContent = '💡 ' + cuento.moraleja;
    const esc = $('#escena');
    esc.style.background = pg.bg;
    esc.innerHTML = pg.s.map(([e, x, y, size, anim]) =>
      `<span class="e ${anim || ''}" style="left:${x}%;top:${y}%;font-size:min(${size}vw, ${size * 7.2}px)">${e}</span>`).join('');
    // cada palabra se puede tocar para escucharla
    let idx = 0;
    words = [];
    $('#texto').innerHTML = pg.text.split(' ').map(tok => {
      const start = pg.text.indexOf(tok, idx); idx = start + tok.length;
      words.push({ start, end: idx, tok });
      return `<span class="w" data-i="${words.length - 1}">${tok}</span>`;
    }).join(' ');
    $('#atras').disabled = page === 0;
    $('#adelante').textContent = page === PAGES.length - 1 ? '🔁' : '➡️';
    $('#adelante').setAttribute('aria-label', page === PAGES.length - 1 ? 'Leer otra vez desde el principio' : 'Página siguiente');
    document.querySelectorAll('.punto').forEach((p, i) => p.classList.toggle('on', i === page));
  }

  function highlight(i) { document.querySelectorAll('.texto .w').forEach((w, j) => w.classList.toggle('hi', j === i)); }

  function read() {
    const text = PAGES[page].text;
    let gotBoundary = false;
    J.say(text, {
      rate: 0.75,
      onboundary: e => {
        if (e.name && e.name !== 'word') return;
        gotBoundary = true;
        const i = words.findIndex(w => e.charIndex >= w.start && e.charIndex < w.end);
        if (i >= 0) highlight(i);
      },
      onend: () => {
        highlight(-1);
        if (page === PAGES.length - 1) { J.cheer(true); J.confetti(120); }
      },
    });
    // sin eventos de palabra (algunos navegadores): resaltar al ritmo aproximado
    let i = 0;
    const tick = () => { if (gotBoundary || i >= words.length) return; highlight(i++); setTimeout(tick, 480 + words[i - 1].tok.length * 40); };
    setTimeout(tick, 600);
  }

  $('#texto').addEventListener('click', e => {
    const w = e.target.closest('.w'); if (!w) return;
    const word = w.textContent.replace(/[¡!¿?.,:—]/g, '');
    highlight(+w.dataset.i); J.sparkle(); J.say(word, { rate: 0.7 });
    setTimeout(() => highlight(-1), 1200);
  });
  function go(d) {
    if (page === PAGES.length - 1 && d > 0) page = 0; else page = Math.max(0, Math.min(PAGES.length - 1, page + d));
    J.sfx('pop2', .7); J.stopVoice();
    render(); setTimeout(read, 350);
  }
  $('#atras').onclick = () => go(-1);
  $('#adelante').onclick = () => go(1);
  $('#leer').onclick = () => { J.stopVoice(); read(); };

  // ---------- biblioteca ----------
  const LOLA_CUENTO = { id: 'lola', titulo: 'Lola y la Luna', emoji: '🦊', paginas: null };
  let delServidor = [];
  function abrir(c) {
    J.audio();
    if (c.bloq) { J.sfx('pop'); if (confirm('Este cuento es del plan Familia. ¿Ver el plan?')) location.href = 'cuenta.html'; return; }
    cuento = c.id === 'lola' ? null : c;
    PAGES = c.id === 'lola' ? LOLA : c.paginas.map(escenaDe);
    page = 0;
    $('#titulo').textContent = c.titulo; document.title = c.titulo;
    $('#biblio').hidden = true; ['#libro', '#nav', '#puntos'].forEach(x => { $(x).hidden = false; });
    $('#a-biblio').hidden = false; $('#casa').hidden = true;
    $('#puntos').innerHTML = PAGES.map(() => '<span class="punto"></span>').join('');
    J.sfx('pop2', .7); render(); setTimeout(read, 450);
    history.replaceState(null, '', '#' + c.id);
  }
  function biblioteca() {
    J.stopVoice();
    $('#titulo').textContent = 'Biblioteca'; document.title = 'Biblioteca de cuentos';
    $('#biblio').hidden = false; ['#libro', '#nav', '#puntos'].forEach(x => { $(x).hidden = true; });
    $('#a-biblio').hidden = true; $('#casa').hidden = false;
    pintarBiblioteca();
    history.replaceState(null, '', location.pathname);
  }
  $('#a-biblio').onclick = biblioteca;
  const fam = () => window.Cuenta && Cuenta.esFamilia();
  function todos() {
    const ids = new Set(), out = [];
    [LOLA_CUENTO, ...FABULAS, ...delServidor].forEach(c => { if (!ids.has(c.id)) { ids.add(c.id); out.push({ ...c, bloq: !!c.bloqueado || !!(c.premium && !fam()) || (c.id !== 'lola' && !(c.paginas && c.paginas.length)) }); } });
    return out;
  }
  const tapa = (c, extra = '') => `<button class="tapa ${c.bloq ? 'bloq' : ''} ${extra}" data-id="${J.esc(c.id)}"><span class="em">${c.emoji || '📖'}</span>${J.esc(c.titulo)}${c.premium ? `<span class="tag">${c.bloq ? '🔒 Familia' : '⭐'}</span>` : ''}</button>`;
  function pintarBiblioteca() {
    $('#estantes').innerHTML = todos().map(c => tapa(c)).join('');
    const mis = leerLocal();
    $('#mis-titulo').hidden = !mis.length && !fam();
    $('#mis').innerHTML = mis.map(c => `<div style="position:relative">${tapa(c, 'magia')}<button class="quitar" data-quitar="${J.esc(c.id)}" aria-label="Borrar ${J.esc(c.titulo)}">🗑️</button></div>`).join('');
    $('#ia-form').hidden = !fam();
    const srv = window.Cuenta && Cuenta.servidor();
    $('#nota').textContent = !srv ? '' : fam() ? '' : (Cuenta.conectado() ? '🔒 Los cuentos con candado y los cuentos con sus nombres son del plan Familia.' : 'Entra a tu cuenta para ver más cuentos.');
    if (fam()) { pintarForm(); revisarMagia(); }
  }
  $('#estantes').addEventListener('click', e => { const b = e.target.closest('.tapa'); if (b) abrir(todos().find(c => c.id === b.dataset.id)); });
  $('#mis').addEventListener('click', e => {
    const q = e.target.closest('[data-quitar]');
    if (q) { if (confirm('¿Borrar este cuento?')) { guardarLocal(leerLocal().filter(c => c.id !== q.dataset.quitar)); pintarBiblioteca(); } return; }
    const b = e.target.closest('.tapa'); if (b) abrir(leerLocal().find(c => c.id === b.dataset.id));
  });

  // ---------- cuento con nuestros nombres (plan Familia) ----------
  const TEMAS = [['animales', '🐾 Animales'], ['princesas', '👑 Princesas'], ['espacio', '🚀 El espacio'], ['mar', '🐠 El mar'], ['bosque', '🌳 El bosque'], ['dinosaurios', '🦕 Dinosaurios'], ['ballet', '🩰 Ballet'], ['amistad', '💖 Amistad']];
  const elegidos = new Set(); let tema = 'animales';
  // si el servidor no tiene IA configurada (o falla), se avisa con cariño y el resto de cuentos sigue igual
  const NO_MAGIA = '🌙 Los cuentos mágicos no están disponibles ahora. ¡Los demás cuentos sí!';
  async function revisarMagia() {
    let ia = null;
    try { const c = await Cuenta.configServidor(); ia = c && c.ia; } catch (e) {}
    const sin = ia && ia.disponible === false;
    $('#crear').disabled = !!sin;
    if (sin) $('#ia-msg').textContent = NO_MAGIA;
  }
  function pintarForm() {
    const c = Cuenta.actual() || {};
    const nombres = [...new Set([...(c.perfiles || []).map(p => p.nombre), ...J.progress.players.map(p => p.name), 'Papá', 'Mamá'].filter(Boolean))];
    if (!elegidos.size && nombres[0]) elegidos.add(nombres[0]);
    $('#nombres').innerHTML = nombres.map(n => `<button type="button" class="chip ${elegidos.has(n) ? 'on' : ''}" data-n="${J.esc(n)}">${J.esc(n)}</button>`).join('');
    $('#temas').innerHTML = TEMAS.map(([k, t]) => `<button type="button" class="chip ${k === tema ? 'on' : ''}" data-t="${k}">${t}</button>`).join('');
  }
  $('#nombres').addEventListener('click', e => { const b = e.target.closest('[data-n]'); if (!b) return; const n = b.dataset.n; elegidos.has(n) ? elegidos.delete(n) : elegidos.add(n); J.say(n); pintarForm(); });
  $('#temas').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (!b) return; tema = b.dataset.t; J.sfx('pop'); pintarForm(); });
  $('#ia-form').onsubmit = async e => {
    e.preventDefault();
    const prot = [...elegidos]; const otro = $('#otro').value.trim(); if (otro) prot.push(otro);
    if (!prot.length) { $('#ia-msg').textContent = 'Elige al menos un nombre.'; return; }
    $('#crear').disabled = true; $('#ia-msg').textContent = '✨ Escribiendo el cuento… (puede tardar un poquito)';
    try {
      const d = await Cuenta.api('/api/cuentos/ia', { body: { protagonistas: prot.slice(0, 4), tema } });
      const c = d.cuento; if (!c || !Array.isArray(c.paginas) || !c.paginas.length) throw new Error('El cuento llegó vacío. Intenta otra vez.');
      c.id = c.id || 'ia-' + Date.now().toString(36); c.emoji = c.emoji || '✨';
      guardarLocal([c, ...leerLocal().filter(x => x.id !== c.id)]);
      $('#ia-msg').textContent = ''; $('#otro').value = '';
      J.cheer(); abrir(c);
    } catch (err) { $('#ia-msg').textContent = err.status === 503 ? NO_MAGIA : '😕 ' + err.message; }
    finally { $('#crear').disabled = false; }
  };

  async function cargarServidor() {
    if (!window.Cuenta || !Cuenta.servidor()) return;
    try { await Cuenta.yo(); const d = await Cuenta.api('/api/cuentos'); delServidor = (d.cuentos || []).filter(c => c && c.id && c.titulo); }
    catch (e) { delServidor = []; }
    if (!$('#biblio').hidden) pintarBiblioteca();
  }
  addEventListener('cuenta', () => { if (!$('#biblio').hidden) pintarBiblioteca(); });

  J.refreshMusic();
  pintarBiblioteca();
  cargarServidor().then(() => {
    const id = location.hash.slice(1);
    const c = id && (todos().find(x => x.id === id) || leerLocal().find(x => x.id === id));
    if (c && !c.bloq) abrir(c);
  });
  if (location.hash === '#prueba') window.__cu = { abrir, biblioteca, todos };
})();
</script>
</body>
</html>
