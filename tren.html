<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="icon" href="assets/icono.svg" type="image/svg+xml">
<link rel="icon" href="assets/icono-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="assets/icono-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c9a2ff">
<title>Tren de Sílabas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<link rel="stylesheet" href="css/juego3d.css">
<style>
body { background: linear-gradient(#8fd3ff, #d9f2ff 55%, #9ad86e 55%, #7cc456); min-height: 100vh; overflow: hidden; }
#mensaje { top: 64%; }
#nivel-desc { font-size: 17px; color: #5b6b82; min-height: 1.3em; }
.nubes { position: fixed; inset: 0 0 50% 0; pointer-events: none; font-size: 60px; opacity: .9; }
.nubes span { position: absolute; animation: nube 40s linear infinite; }
@keyframes nube { from { transform: translateX(110vw); } to { transform: translateX(-30vw); } }
.figura { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 74px); transform: translateX(-50%); display: flex; gap: 12px; align-items: center; background: #fff; border-radius: 26px; padding: 8px 18px; box-shadow: 0 6px 0 rgba(35, 50, 74, .2); z-index: 4; }
.figura .emo { font-size: clamp(54px, 11vh, 90px); line-height: 1; }
.figura button { background: var(--purple); color: #fff; border-radius: 50%; width: 54px; height: 54px; font-size: 24px; box-shadow: 0 4px 0 var(--purple-dark); }
.via { position: fixed; left: 0; right: 0; top: 52%; height: 14px; background: repeating-linear-gradient(90deg, #8a5a33 0 16px, transparent 16px 34px), linear-gradient(#777, #777) 0 10px / 100% 4px no-repeat; }
.tren { position: fixed; top: calc(52% - 112px); left: 50%; display: flex; align-items: flex-end; gap: 6px; transform: translateX(-50%); transition: transform 3s cubic-bezier(.45, 0, .85, .5); z-index: 3; }
.tren.sale, .tren.llega.sale { animation: tren-sale 3.4s cubic-bezier(.55, 0, .9, .45) forwards; }
@keyframes tren-sale { 0% { transform: translateX(-50%); } 12% { transform: translateX(calc(-50% + 14px)); } 100% { transform: translateX(calc(-50% - 130vw)); } }
.tren.llega { animation: llega 1.2s cubic-bezier(.2, .9, .3, 1); }
@keyframes llega { from { transform: translateX(60vw); } to { transform: translateX(-50%); } }
.loco { position: relative; font-size: 104px; line-height: .9; filter: drop-shadow(0 4px 0 rgba(0,0,0,.15)); display: inline-block; }
/* carita feliz de la locomotora cuando se va */
.loco .cara { position: absolute; left: 4%; top: 30%; width: 44%; aspect-ratio: 1; border-radius: 50%; background: #ffe4c4; border: 3px solid #23324a; transform: scale(0); transition: transform .35s cubic-bezier(.3, 1.6, .5, 1); }
.loco .cara i { position: absolute; top: 30%; width: 16%; height: 22%; border-radius: 50%; background: #23324a; animation: parpadeo 2.4s infinite; }
.loco .cara i:nth-child(1) { left: 24%; } .loco .cara i:nth-child(2) { right: 24%; }
.loco .cara b { position: absolute; left: 25%; right: 25%; top: 52%; height: 26%; border-radius: 0 0 40px 40px; background: #e8473c; border: 2px solid #23324a; border-top: 0; }
.loco .cara s { position: absolute; top: 50%; width: 16%; height: 12%; border-radius: 50%; background: #ff9ab8; } .loco .cara s:nth-of-type(1) { left: 6%; } .loco .cara s:nth-of-type(2) { right: 6%; }
@keyframes parpadeo { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.tren.feliz .loco .cara { transform: scale(1); }
.tren.feliz .loco { animation: saltito .42s ease-in-out infinite; }
.tren.feliz .vagon { animation: saltito .42s ease-in-out infinite; }
.tren.feliz .vagon:nth-child(odd) { animation-delay: .21s; }
@keyframes saltito { 0%, 100% { translate: 0 0; } 50% { translate: 0 -12px; rotate: -2deg; } }
.vagon::before, .vagon::after { border-top-color: #fff !important; }
.tren.feliz .vagon::before, .tren.feliz .vagon::after { animation: rueda .35s linear infinite; }
@keyframes rueda { to { transform: rotate(-360deg); } }
/* viaje: el paisaje corre hacia atrás, sale humo de verdad y el tren arranca hacia adelante */
body.viaje .via { animation: via-corre .35s linear infinite; }
@keyframes via-corre { to { background-position: 34px 0, 0 10px; } }
body.viaje .nubes span { animation-duration: 6s; }
.pasto { position: fixed; left: 0; right: 0; top: calc(52% + 30px); height: 40px; pointer-events: none; background: radial-gradient(circle at 10px 20px, #5fae3f 6px, transparent 7px) 0 0 / 90px 40px, radial-gradient(circle at 50px 14px, #f7d046 5px, transparent 6px) 0 0 / 130px 40px, radial-gradient(circle at 30px 26px, #ff8fb8 5px, transparent 6px) 0 0 / 170px 40px; opacity: .9; }
body.viaje .pasto { animation: pasto-corre .5s linear infinite; }
@keyframes pasto-corre { to { background-position: 90px 0, 130px 0, 170px 0; } }
.bola-humo { position: fixed; z-index: 5; pointer-events: none; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #e9eef5 55%, rgba(210,218,230,.85)); box-shadow: inset -6px -8px 0 rgba(180,190,205,.35); animation: bola-humo 1.8s ease-out forwards; }
@keyframes bola-humo { from { opacity: .95; transform: translate(-50%, 0) scale(.35); } to { opacity: 0; transform: translate(calc(-50% + 160px), -110px) scale(1.5); } }
.rayas { position: fixed; z-index: 2; pointer-events: none; height: 6px; border-radius: 6px; background: rgba(255,255,255,.9); animation: raya .5s linear forwards; }
@keyframes raya { from { opacity: .9; transform: translateX(0) scaleX(.4); } to { opacity: 0; transform: translateX(160px) scaleX(1); } }
.globo-chu { position: fixed; z-index: 6; background: #fff; border-radius: 20px; padding: 6px 14px; font: 800 clamp(20px, 4vw, 30px) var(--font-display, sans-serif); color: #e8473c; box-shadow: 0 4px 0 rgba(0,0,0,.15); animation: globo-chu 1.2s ease-out forwards; pointer-events: none; }
@keyframes globo-chu { from { opacity: 0; transform: translate(-50%, 10px) scale(.6); } 20% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } to { opacity: 0; transform: translate(-50%, -40px) scale(1); } }
@media (prefers-reduced-motion: reduce) { body.viaje .via, body.viaje .pasto { animation: none; } .bola-humo, .rayas { display: none; } }
.humo { position: fixed; z-index: 5; font-size: 34px; pointer-events: none; animation: humo 1.6s ease-out forwards; }
@keyframes humo { from { opacity: 1; transform: translate(-50%, 0) scale(.5); } to { opacity: 0; transform: translate(calc(-50% + 60px), -140px) scale(1.4) rotate(20deg); } }
.vagon { position: relative; width: clamp(84px, 17vw, 122px); height: 92px; border-radius: 14px 14px 8px 8px; background: var(--c, #ef5b5b); box-shadow: inset 0 -10px 0 rgba(0,0,0,.15); display: grid; place-items: center; margin-bottom: 14px; }
.vagon::before, .vagon::after { content: ''; position: absolute; bottom: -16px; width: 28px; height: 28px; border-radius: 50%; background: #333; border: 5px solid #bbb; box-sizing: border-box; }
.vagon::before { left: 10px; } .vagon::after { right: 10px; }
.vagon.grande { width: auto; height: auto; min-height: 104px; padding: 12px 14px 16px 74px; display: flex; align-items: center; gap: 10px; border-radius: 18px 18px 10px 10px; }
.vagon.grande::before { left: 22px; } .vagon.grande::after { right: 22px; }
.vagon.grande .techo { position: absolute; left: -6px; right: -6px; top: -14px; height: 16px; border-radius: 12px 12px 4px 4px; background: color-mix(in srgb, var(--c) 70%, #23324a); }
.vagon.grande .frente { position: absolute; left: 10px; top: 50%; translate: 0 -50%; width: 56px; height: 56px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 36px; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.vagon .ventana { width: clamp(70px, 14vw, 104px); height: clamp(62px, 11vh, 84px); border-radius: 14px; background: #dff3ff; border: 4px dashed rgba(35,50,74,.35); display: grid; place-items: center; font-family: var(--font-letters); font-weight: 700; font-size: clamp(30px, 6vw, 46px); color: #23324a; box-shadow: inset 0 -6px 0 rgba(63,142,232,.18); }
.vagon .ventana.llena { border-style: solid; border-color: #fff; background: #fff; animation: brinco .45s; }
@media (max-width: 520px) { .tren .loco { font-size: 62px; } .vagon.grande { min-height: 78px; padding: 8px 8px 12px 50px; gap: 5px; } .vagon.grande::before, .vagon.grande::after { width: 22px; height: 22px; bottom: -12px; } .vagon.grande .frente { left: 6px; width: 40px; height: 40px; font-size: 24px; } .vagon .ventana { width: 54px; height: 56px; font-size: 26px; border-width: 3px; } }
.vagon .hueco { width: 78%; height: 66%; border-radius: 10px; background: rgba(255,255,255,.85); border: 3px dashed rgba(35,50,74,.35); display: grid; place-items: center; font-family: var(--font-letters); font-weight: 700; font-size: clamp(32px, 6vw, 46px); color: #23324a; }
.vagon.lleno .hueco { border-style: solid; border-color: #fff; background: #fff; animation: brinco .45s; }
.opciones { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; padding: 0 12px; z-index: 4; }
.op { min-width: 104px; height: 96px; padding: 0 16px; border-radius: 22px; background: #fff; font-family: var(--font-letters); font-weight: 700; font-size: 46px; color: #23324a; box-shadow: 0 7px 0 #c7a76b; border: 5px solid var(--c, #ffd23f); animation: entra .6s cubic-bezier(.2, 1.4, .4, 1) both; touch-action: manipulation; }
.op:active { transform: translateY(5px); box-shadow: 0 2px 0 #c7a76b; }
.op.usada { visibility: hidden; }
.op.mal { animation: tiembla .4s; border-color: #ef5b5b; }
@keyframes entra { from { transform: translateX(100vw) rotate(10deg); } to { transform: none; } }
@keyframes tiembla { 0%, 100% { translate: 0; } 25% { translate: -8px; } 75% { translate: 8px; } }
@media (prefers-reduced-motion: reduce) { .op, .tren.llega, .nubes span { animation: none; } .tren { transition: none; } }
@media (max-height: 560px) { .loco { font-size: 76px; } .vagon { height: 72px; } .op { height: 74px; font-size: 36px; } }
</style>
<script src="js/comun.js"></script>
<script src="js/tema.js"></script>
</head>
<body>
<div class="nubes" aria-hidden="true"><span style="top:12%;animation-delay:-5s">☁️</span><span style="top:28%;animation-delay:-22s;font-size:44px">☁️</span></div>
<div class="hud">
  <div class="hud-side">
    <a class="round-btn btn" href="index.html" aria-label="Volver al inicio">🏠</a>
    <div class="pill">Nivel <span id="nivel-num">1</span></div>
  </div>
  <div class="hud-side">
    <button class="round-btn" data-musica aria-label="Música">🎵</button>
    <div class="pill" id="jugador"></div>
  </div>
</div>
<div class="figura" id="figura" hidden><span class="emo" id="emo"></span><button id="decir" aria-label="Escuchar otra vez">🔊</button></div>
<div class="via" aria-hidden="true"></div>
<div class="pasto" aria-hidden="true"></div>
<div class="tren" id="tren" aria-label="Tren"></div>
<div class="opciones" id="opciones" aria-label="Sílabas"></div>
<div class="metas" id="metas" style="top:auto;bottom:140px"></div>
<div id="mensaje" aria-live="polite"></div>

<div class="portada" id="portada">
  <div class="portada-caja">
    <div style="font-size:64px;line-height:1">🚂🚃🚃</div>
    <h1>Tren de Sílabas</h1>
    <p>Mira el dibujo, escucha la palabra y <b>sube las sílabas</b> al tren en orden. ¡Chu chuuu!</p>
    <div class="niveles" id="niveles" aria-label="Elige el nivel"></div>
    <div id="nivel-desc"></div>
    <button class="go" id="empezar" disabled>Cargando…</button>
  </div>
</div>

<script>
(() => {
  const J = window.Juego, P = J.progress;
  const $ = s => document.querySelector(s);
  const NIVELES = [
    { sil: [2], extra: 0, meta: 5, nombre: 'Palabras de 2 sílabas' },
    { sil: [2], extra: 2, meta: 5, nombre: 'Con sílabas que despistan' },
    { sil: [3], extra: 0, meta: 5, facil: true, nombre: '3 sílabas fáciles (3 ventanitas)' },
    { sil: [3], extra: 1, meta: 5, nombre: 'Palabras de 3 sílabas' },
    { sil: [2, 3], extra: 3, meta: 6, nombre: 'Tren largo' },
  ];
  const COLS = ['#ef5b5b', '#3f8ee8', '#4cb87a', '#f39a3b', '#9a6ee0', '#ff7eb6'];
  const state = { nivel: 0, w: null, sils: [], paso: 0, hechas: 0, jugando: false, usadas: [] };
  let PALABRAS = [];
  const sils = w => w[1].split('-').map(s => s.toLowerCase());

  function updatePlayer() { const p = J.player(); $('#jugador').innerHTML = `${J.CHARS[p.char]?.emoji || '⭐'} ${J.esc(p.name)} · ⭐ ${p.stars}`; }
  function message(text, secs = 1.4) {
    const el = $('#mensaje'); el.textContent = text;
    el.classList.remove('ver'); void el.offsetWidth; el.classList.add('ver');
    clearTimeout(message.t); message.t = setTimeout(() => el.classList.remove('ver'), secs * 1000);
  }
  function chuchu() { J.tones([392, 494], .22, 'sawtooth', .07); setTimeout(() => J.tones([392, 494], .3, 'sawtooth', .07), 520); }

  function nuevaPalabra() {
    const cfg = NIVELES[state.nivel];
    // fáciles: cada sílaba es consonante + vocal (pe-lo-ta, to-ma-te), sin tildes
    const facil = w => sils(w).every(x => /^[bcdfgjlmnprstvz]?[aeiou]$/.test(x));
    let pool = PALABRAS.filter(w => cfg.sil.includes(sils(w).length) && w[2] && (!cfg.facil || facil(w)));
    if (cfg.facil && pool.length < 6) {
      // palabras fáciles de 3 sílabas de repuesto (si la lista configurada tiene pocas)
      const EXTRA = [['pelota', 'pe-lo-ta', '⚽'], ['tomate', 'to-ma-te', '🍅'], ['conejo', 'co-ne-jo', '🐰'], ['paloma', 'pa-lo-ma', '🕊️'], ['camisa', 'ca-mi-sa', '👕'],
        ['zapato', 'za-pa-to', '👟'], ['banana', 'ba-na-na', '🍌'], ['patito', 'pa-ti-to', '🐥'], ['pepino', 'pe-pi-no', '🥒'], ['cometa', 'co-me-ta', '🪁'],
        ['corona', 'co-ro-na', '👑'], ['gusano', 'gu-sa-no', '🐛'], ['sirena', 'si-re-na', '🧜‍♀️'], ['casita', 'ca-si-ta', '🏠']];
      pool = [...pool, ...EXTRA.filter(e => !pool.some(w => w[0] === e[0]))];
    }
    if (!pool.length) pool = PALABRAS.filter(w => sils(w).length >= 2);
    const fresh = pool.filter(w => !state.usadas.includes(w[0]));
    const w = J.pick(fresh.length ? fresh : pool);
    state.usadas.push(w[0]); state.w = w; state.sils = sils(w); state.paso = 0;
    // tren con un vagón vacío por sílaba
    const tren = $('#tren'); tren.className = 'tren';
    // un solo vagón por palabra: adelante el dibujo de lo que se busca y una ventanita por sílaba
    const color = COLS[state.hechas % COLS.length];
    tren.innerHTML = '<span class="loco" aria-hidden="true">🚂<span class="cara"><i></i><i></i><b></b><s></s><s></s></span></span>' +
      `<div class="vagon grande" style="--c:${color}"><span class="techo"></span><span class="frente" aria-hidden="true">${w[2] || '🔊'}</span>${state.sils.map(() => '<span class="ventana"></span>').join('')}</div>`;
    void tren.offsetWidth; tren.classList.add('llega');
    $('#emo').textContent = w[2] || '🔊';
    $('#figura').hidden = false;
    // vagoncitos con sílabas desordenadas (más las que despistan)
    const todas = [...new Set(PALABRAS.flatMap(sils))].filter(s => !state.sils.includes(s));
    const ops = J.shuffle([...state.sils, ...J.shuffle(todas).slice(0, cfg.extra)]);
    $('#opciones').innerHTML = ops.map((s, i) => `<button class="op" style="--c:${COLS[(i + 2) % COLS.length]};animation-delay:${.15 * i + .4}s" data-s="${J.esc(s)}">${J.esc(s)}</button>`).join('');
    chuchu();
    setTimeout(decir, 700);
  }
  function decir() { if (state.w) J.say(['Sube las sílabas de', state.w[0]]); }
  $('#decir').onclick = () => state.w && J.say(state.w[0]);

  $('#opciones').onclick = e => {
    const b = e.target.closest('.op'); if (!b || !state.jugando || b.classList.contains('usada')) return;
    tocar(b);
  };
  function tocar(b) {
    const s = b.dataset.s, need = state.sils[state.paso];
    if (s === need) {
      b.classList.add('usada');
      const v = $('#tren').querySelectorAll('.ventana')[state.paso];
      v.classList.add('llena'); v.textContent = s;
      J.sfx('pop', .8, 1 + state.paso * .12);
      J.say(s);
      state.paso++;
      if (state.paso >= state.sils.length) completa();
    } else {
      b.classList.remove('mal'); void b.offsetWidth; b.classList.add('mal');
      J.efecto('error');
      J.say(['Escucha', state.w[0]]);
    }
  }
  // humo de corazones y estrellitas que sale de la chimenea
  function humo() {
    const l = $('#tren .loco'); if (!l) return;
    const r = l.getBoundingClientRect();
    const h = document.createElement('span'); h.className = 'humo'; h.textContent = J.pick(['💖', '⭐', '💨', '🌟', '💗']);
    h.style.left = (r.left + r.width * .25) + 'px'; h.style.top = (r.top - 10) + 'px';
    document.body.appendChild(h); setTimeout(() => h.remove(), 1700);
  }
  // humo de verdad: bolitas blancas que salen de la chimenea y se quedan atrás
  function bocanada() {
    const l = $('#tren .loco'); if (!l) return;
    const r = l.getBoundingClientRect(), t = 26 + Math.random() * 40;
    const b = document.createElement('span'); b.className = 'bola-humo';
    b.style.width = b.style.height = t + 'px';
    b.style.left = (r.left + r.width * .3 + (Math.random() - .5) * 10) + 'px'; b.style.top = (r.top - t * .3) + 'px';
    document.body.appendChild(b); setTimeout(() => b.remove(), 1900);
  }
  // rayitas de velocidad detrás del último vagón
  function rayas() {
    const t = $('#tren'); if (!t) return;
    const r = t.getBoundingClientRect();
    for (let k = 0; k < 3; k++) {
      const s = document.createElement('span'); s.className = 'rayas';
      s.style.left = (r.right + 6) + 'px'; s.style.top = (r.top + r.height * (.25 + k * .25)) + 'px'; s.style.width = (40 + Math.random() * 50) + 'px';
      document.body.appendChild(s); setTimeout(() => s.remove(), 550);
    }
  }
  function globoChu() {
    const l = $('#tren .loco'); if (!l) return;
    const r = l.getBoundingClientRect(), g = document.createElement('span');
    g.className = 'globo-chu'; g.textContent = '¡Chu-chu!'; g.style.left = (r.left + r.width / 2) + 'px'; g.style.top = (r.top - 70) + 'px';
    document.body.appendChild(g); setTimeout(() => g.remove(), 1300);
  }
  function completa() {
    state.jugando = false;
    state.hechas++;
    $('#metas').children[state.hechas - 1]?.classList.add('on');
    J.addStar(); updatePlayer();
    setTimeout(() => {
      // ¡el tren se pone feliz! sonríe, salta, y se va contento
      const tren = $('#tren');
      tren.classList.add('feliz');
      J.efecto('acierto'); J.confetti(70);
      message('¡' + state.w[0] + '!');
      J.say([state.w[0], J.pick(J.PRAISES)]);
      // 1) el tren se pone feliz y echa humo; el paisaje empieza a correr (¡ya va avanzando!)
      const hum = setInterval(humo, 380), bol = setInterval(bocanada, 110);
      document.body.classList.add('viaje'); globoChu(); chuchu();
      let chuf = 0; const ritmo = setInterval(() => { J.tones([110 + (chuf++ % 2) * 20], .08, 'square', .035); }, 260);
      setTimeout(() => {
        // 2) arranca de verdad hacia adelante, con rayitas de velocidad
        chuchu(); globoChu();
        const ray = setInterval(rayas, 140);
        tren.classList.remove('llega'); void tren.offsetWidth; tren.classList.add('sale');
        setTimeout(() => { clearInterval(ray); clearInterval(bol); clearInterval(ritmo); document.body.classList.remove('viaje'); }, 2400);
        $('#opciones').innerHTML = '';
        setTimeout(() => {
          clearInterval(hum);
          if (state.hechas >= NIVELES[state.nivel].meta) return nivelListo();
          J.nextTurn(() => { state.jugando = true; nuevaPalabra(); }, { onShow: updatePlayer });
        }, 3000);
      }, 1500);
    }, 400);
  }
  function nivelListo() {
    J.efecto('festejo'); J.confetti(90);
    P.level.tren = Math.max(P.level.tren || 0, state.nivel + 1); J.save();
    J.gift(() => { state.nivel = Math.min(state.nivel + 1, NIVELES.length - 1); empezar(); });
  }
  function empezar() {
    const cfg = NIVELES[state.nivel];
    state.hechas = 0; state.usadas = [];
    $('#nivel-num').textContent = state.nivel + 1;
    $('#metas').innerHTML = Array.from({ length: cfg.meta }, () => '<span class="meta">🚃</span>').join('');
    updatePlayer();
    const go = () => { state.jugando = true; nuevaPalabra(); };
    P.two ? J.showTurn(go, { onShow: updatePlayer }) : go();
  }
  function start(i) {
    $('#portada').hidden = true;
    J.audio(); J.startMusic();
    state.nivel = i;
    empezar();
  }

  (async () => {
    await J.ready;
    PALABRAS = J.palabras('tren').filter(w => w[1] && w[1].includes('-'));
    if (PALABRAS.length < 4) PALABRAS = J.WORDS.filter(w => w[1].includes('-'));
    updatePlayer(); J.refreshMusic();
    const unlocked = Math.min(NIVELES.length, (P.level.tren || 0) + 1);
    let sel = unlocked - 1;
    const box = $('#niveles');
    box.innerHTML = NIVELES.map((n, i) => `<button data-i="${i}" title="${n.nombre}" ${i >= unlocked ? 'disabled aria-label="Nivel bloqueado"' : ''} class="${i === sel ? 'on' : ''}">${i < unlocked ? i + 1 : '🔒'}</button>`).join('');
    box.onclick = e => { const b = e.target.closest('[data-i]'); if (!b || b.disabled) return; sel = +b.dataset.i; [...box.children].forEach((c, k) => c.classList.toggle('on', k === sel)); $('#nivel-desc').textContent = NIVELES[sel].nombre; J.sfx('pop'); };
    $('#nivel-desc').textContent = NIVELES[sel].nombre;
    const go = $('#empezar'); go.disabled = false; go.textContent = '▶ ¡Chu chuuu!';
    go.onclick = () => start(sel);
    if (location.hash === '#prueba') { window.__t = { state, tocar, NIVELES, start }; start(0); }
  })();
})();
</script>
