<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Jueguito mágico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<link rel="stylesheet" href="css/juego3d.css">
<style>
body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: linear-gradient(135deg, var(--tema-bg1, #ffd6ec), var(--tema-bg2, #c9b6ff)); overflow: hidden; }
.barra { display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px; }
.barra h1 { margin: 0; font: 800 clamp(20px, 5vw, 28px)/1.1 "Baloo 2", system-ui, sans-serif; color: var(--tema-tinta, #23324a); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.marco { flex: 1; margin: 0 10px calc(env(safe-area-inset-bottom, 0px) + 10px); border-radius: 22px; overflow: hidden; background: #fff; box-shadow: 0 6px 0 rgba(90, 60, 140, .25); }
.aviso { display: grid; place-items: center; height: 100%; padding: 24px; text-align: center; font: 700 22px/1.3 "Baloo 2", system-ui, sans-serif; color: #5b6b82; box-sizing: border-box; }
</style>
<script>window.SIN_MUSICA = true; // el jueguito trae su propio sonido</script>
<script src="js/comun.js"></script>
<script src="js/tema.js"></script>
<script src="js/ia.js"></script>
</head>
<body>
<div class="barra">
  <a class="round-btn btn" href="index.html" aria-label="Volver al inicio">🏠</a>
  <h1 id="titulo">✨ Jueguito mágico</h1>
</div>
<div class="marco" id="marco"><div class="aviso">Cargando la magia… ✨</div></div>
<script>
(async () => {
  const J = window.Juego, $ = s => document.querySelector(s);
  const id = (new URLSearchParams(location.search).get('id') || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
  let j = id && IA.juegoLocal(id);
  if (!j && id) {
    try {
      const [lista, r] = await Promise.all([IA.juegosPublicados(), fetch(`juegos-ia/${id}.html`)]);
      if (r.ok) { const meta = lista.find(x => x.id === id) || {}; j = { id, titulo: meta.titulo || 'Jueguito mágico', emoji: meta.emoji || '✨', html: await r.text() }; }
    } catch (e) {}
  }
  if (!j) { $('#marco').innerHTML = '<div class="aviso">No encontré ese jueguito 😢<br>Vuelve al inicio y elige otro.</div>'; return; }
  document.title = j.titulo;
  $('#titulo').textContent = `${j.emoji} ${j.titulo}`;
  IA.montarJuego($('#marco'), j.html, j.titulo);
  J.say(j.titulo);
  if (location.hash === '#prueba') window.__ji = { j };
})();
</script>
</body>
</html>
