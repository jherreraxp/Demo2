<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Fuegos Artificiales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<link rel="stylesheet" href="css/juego3d.css">
<style>
body { background: linear-gradient(#120a35, #3b2a7a 55%, #b0479e); }
#cielo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.abajo { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 6; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.abajo > * { pointer-events: auto; }
.modos, .letras { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 0 10px; }
.modos button { border-radius: 18px; padding: 8px 16px; font-size: 19px; font-weight: 800; background: rgba(255,255,255,.88); box-shadow: 0 4px 0 rgba(0,0,0,.35); }
.modos button.on { background: var(--gold); }
.letras button { width: 50px; height: 50px; border-radius: 14px; font: 700 28px var(--font-letters); background: rgba(255,255,255,.18); color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.35); border: 2px solid rgba(255,255,255,.5); }
.letras button.on { background: #ff5dab; border-color: #fff; }
.ayuda { position: fixed; left: 0; right: 0; top: 42%; text-align: center; color: rgba(255,255,255,.85); font-size: clamp(22px, 5vw, 34px); font-weight: 800; pointer-events: none; transition: opacity .6s; text-shadow: 0 3px 0 rgba(0,0,0,.3); }
</style>
<script src="js/comun.js"></script>
<script src="js/tema.js"></script>
</head>
<body>
<canvas id="cielo" aria-label="Cielo de noche: toca para lanzar fuegos artificiales"></canvas>
<div class="hud">
  <div class="hud-side">
    <a class="round-btn btn" href="index.html" aria-label="Volver al inicio">🏠</a>
    <div class="pill" aria-label="Fuegos">🎆 <span id="cuenta">0</span></div>
  </div>
  <div class="hud-side">
    <button class="round-btn" data-musica aria-label="Música">🎵</button>
    <div class="pill" id="jugador"></div>
  </div>
</div>
<div class="ayuda" id="ayuda">👆 ¡Toca el cielo!</div>
<div id="mensaje" aria-live="polite"></div>
<div class="abajo">
  <div class="letras" id="letras" hidden></div>
  <div class="modos" id="modos">
    <button data-modo="libre" class="on">🎆 Libre</button>
    <button data-modo="letra">🔤 Letra del día</button>
  </div>
</div>
<script>
(() => {
  const J = window.Juego, P = J.progress;
  const $ = s => document.querySelector(s);
  const cv = $('#cielo'), g = cv.getContext('2d');
  const LETRAS = ['a', 'e', 'i', 'o', 'u', 'm', 's', 'l', 'p'];
  const COLORES = ['#ff5dab', '#ffd23f', '#7fd3ff', '#b18cf0', '#7be08a', '#ff8a3d', '#ffffff'];
  const state = { modo: 'libre', letra: LETRAS[new Date().getDate() % 5], cohetes: [], chispas: [], cuenta: 0, t: 0 };
  let W = 0, H = 0, dpr = 1, estrellas = [], ciudad = [];

  function updatePlayer() { const p = J.player(); $('#jugador').innerHTML = `${J.CHARS[p.char]?.emoji || '⭐'} ${J.esc(p.name)} · ⭐ ${p.stars}`; }
  function message(text, secs = 1.4) {
    const el = $('#mensaje'); el.textContent = text;
    el.classList.remove('ver'); void el.offsetWidth; el.classList.add('ver');
    clearTimeout(message.t); message.t = setTimeout(() => el.classList.remove('ver'), secs * 1000);
  }
  function resize() {
    dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
    estrellas = Array.from({ length: Math.round(W * H / 6000) }, () => ({ x: Math.random() * W, y: Math.random() * H * .7, r: Math.random() * 1.6 + .3, f: Math.random() * 6 }));
    // ciudad de bloquecitos rosados y morados
    ciudad = []; let x = 0;
    while (x < W) { const w = 30 + Math.random() * 50, h = 40 + Math.random() * H * .16; ciudad.push({ x, w, h, c: J.pick(['#5b2a86', '#7a3aa8', '#a0479e', '#4b2a7a']) }); x += w; }
  }
  addEventListener('resize', resize); resize();

  // ---------- sonidos ----------
  function silbido(dur) {
    const c = J.audio(); if (!c) return;
    const t = c.currentTime, o = c.createOscillator(), gg = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(700, t); o.frequency.exponentialRampToValueAtTime(2200, t + dur);
    gg.gain.setValueAtTime(.0001, t); gg.gain.exponentialRampToValueAtTime(.05, t + .05); gg.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(gg).connect(c.destination); o.start(t); o.stop(t + dur + .02);
  }
  function boom(grande) {
    const c = J.audio(); if (!c) return;
    const t = c.currentTime, len = c.sampleRate * 1.4, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), gg = c.createGain();
    s.buffer = buf; f.type = 'lowpass'; f.frequency.setValueAtTime(grande ? 1400 : 2200, t); f.frequency.exponentialRampToValueAtTime(120, t + 1.2);
    gg.gain.value = grande ? .7 : .5; s.connect(f).connect(gg).connect(c.destination); s.start(t);
    const o = c.createOscillator(), og = c.createGain(); o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(40, t + .4);
    og.gain.setValueAtTime(.5, t); og.gain.exponentialRampToValueAtTime(.0001, t + .5); o.connect(og).connect(c.destination); o.start(t); o.stop(t + .55);
    // chisporroteo
    for (let k = 0; k < 14; k++) { const tt = t + .25 + Math.random() * .9, n = c.createBufferSource(), nf = c.createBiquadFilter(), ng = c.createGain(); n.buffer = buf; nf.type = 'highpass'; nf.frequency.value = 4000; ng.gain.setValueAtTime(.12, tt); ng.gain.exponentialRampToValueAtTime(.0001, tt + .03); n.connect(nf).connect(ng).connect(c.destination); n.start(tt, Math.random(), .04); }
  }

  // ---------- puntos con forma de letra ----------
  const formas = {};
  function puntosLetra(l) {
    if (formas[l]) return formas[l];
    const S = 120, c = document.createElement('canvas'); c.width = c.height = S;
    const x = c.getContext('2d'); x.fillStyle = '#000'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = `700 ${S * .85}px Andika, "Century Gothic", sans-serif`; x.fillText(l, S / 2, S / 2 + S * .04);
    const d = x.getImageData(0, 0, S, S).data, pts = [];
    for (let yy = 0; yy < S; yy += 5) for (let xx = 0; xx < S; xx += 5) if (d[(yy * S + xx) * 4 + 3] > 128) pts.push([(xx - S / 2) / S, (yy - S / 2) / S]);
    return (formas[l] = pts);
  }

  // ---------- fuegos ----------
  function lanzar(tx, ty, letra = null) {
    J.audio();
    const dur = .7 + Math.random() * .3;
    silbido(dur);
    state.cohetes.push({ x: W / 2 + (tx - W / 2) * .3, y: H, tx, ty, t: 0, dur, c: J.pick(COLORES), letra });
    $('#ayuda').style.opacity = 0;
  }
  function explotar(k) {
    const grande = !!k.letra;
    boom(grande);
    const c1 = k.c, c2 = J.pick(COLORES);
    if (k.letra) {
      // las chispas viajan hasta dibujar la letra en el cielo
      const size = Math.min(W * .9, H * .8);
      puntosLetra(k.letra).forEach(([px, py], i) => state.chispas.push({ x: k.tx, y: k.ty, fx: k.tx + px * size, fy: k.ty + py * size, t: 0, vida: 3.2, c: i % 3 ? c1 : c2, letra: true, r: 3.2 }));
      if (LETRAS.slice(0, 5).includes(k.letra)) J.say(k.letra, { queue: true }); else J.sound(k.letra);
    } else {
      const n = 70 + Math.round(Math.random() * 40), tipo = Math.floor(Math.random() * 3);
      for (let i = 0; i < n; i++) {
        const a = i / n * Math.PI * 2, v = (tipo === 1 ? (i % 2 ? 170 : 90) : 80 + Math.random() * 120) * (tipo === 2 ? (1 + Math.sin(a * 5) * .35) : 1);
        state.chispas.push({ x: k.tx, y: k.ty, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, vida: 1.4 + Math.random() * .8, c: i % 2 ? c1 : c2, r: 2.4 });
      }
    }
    state.cuenta++; $('#cuenta').textContent = state.cuenta;
    if (state.cuenta % 12 === 0) { J.cheer(); J.addStar(); updatePlayer(); P.level.fuegos = Math.max(P.level.fuegos || 0, 1); J.save(); }
  }
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    const y = Math.min(e.clientY, H * .72);
    // en "Letra del día" siempre dibuja la letra; en libre, de vez en cuando sale una vocal sorpresa
    const letra = state.modo === 'letra' ? state.letra : (Math.random() < .2 ? J.pick(LETRAS.slice(0, 5)) : null);
    lanzar(e.clientX, Math.max(H * .22, y), letra);
  });

  function frame(now) {
    const dt = Math.min(.05, (now - (frame.l || now)) / 1000); frame.l = now; state.t += dt;
    // cielo con estela suave
    g.globalCompositeOperation = 'source-over';
    const grad = g.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, 'rgba(18,10,53,.38)'); grad.addColorStop(.6, 'rgba(59,42,122,.38)'); grad.addColorStop(1, 'rgba(176,71,158,.38)');
    g.fillStyle = grad; g.fillRect(0, 0, W, H);
    estrellas.forEach(s => { g.fillStyle = `rgba(255,255,255,${.4 + Math.sin(state.t * 2 + s.f) * .3})`; g.fillRect(s.x, s.y, s.r, s.r); });
    // luna
    g.fillStyle = '#fff6c9'; g.beginPath(); g.arc(W * .85, H * .14, Math.min(W, H) * .05, 0, 7); g.fill();
    g.globalCompositeOperation = 'lighter';
    for (const k of state.cohetes.slice()) {
      k.t += dt; const p = Math.min(1, k.t / k.dur), e = 1 - Math.pow(1 - p, 2);
      const x = k.x + (k.tx - k.x) * e, y = k.y + (k.ty - k.y) * e;
      g.fillStyle = k.c; g.beginPath(); g.arc(x, y, 3.5, 0, 7); g.fill();
      if (Math.random() < .9) state.chispas.push({ x, y, vx: (Math.random() - .5) * 30, vy: 30 + Math.random() * 30, t: 0, vida: .5, c: '#ffd9a0', r: 1.6 });
      if (p >= 1) { state.cohetes.splice(state.cohetes.indexOf(k), 1); explotar(k); }
    }
    for (const s of state.chispas.slice()) {
      s.t += dt;
      if (s.letra) {
        // primero vuela a su lugar, se queda brillando y luego cae
        const p = Math.min(1, s.t / .6), e = 1 - Math.pow(1 - p, 3);
        if (s.t < 2.2) { s.dx = s.x + (s.fx - s.x) * e; s.dy = s.y + (s.fy - s.y) * e; }
        else { s.vy2 = (s.vy2 || 0) + 120 * dt; s.dy += s.vy2 * dt; }
        const a = s.t < 2.2 ? 1 : Math.max(0, 1 - (s.t - 2.2) / 1);
        g.globalAlpha = a * (.75 + Math.sin(state.t * 20 + s.fx) * .25); g.fillStyle = s.c; g.beginPath(); g.arc(s.dx, s.dy, s.r, 0, 7); g.fill();
      } else {
        s.vy += 70 * dt; s.vx *= .985; s.vy *= .985; s.x += s.vx * dt; s.y += s.vy * dt;
        g.globalAlpha = Math.max(0, 1 - s.t / s.vida); g.fillStyle = s.c; g.beginPath(); g.arc(s.x, s.y, s.r, 0, 7); g.fill();
      }
      if (s.t > s.vida) state.chispas.splice(state.chispas.indexOf(s), 1);
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    ciudad.forEach(b => {
      g.fillStyle = b.c; g.fillRect(b.x, H - b.h, b.w + 1, b.h);
      g.fillStyle = 'rgba(255, 220, 120, .55)';
      for (let yy = H - b.h + 10; yy < H - 14; yy += 18) for (let xx = b.x + 8; xx < b.x + b.w - 10; xx += 16) if ((xx * 7 + yy * 3) % 5 < 3) g.fillRect(xx, yy, 7, 8);
    });
    requestAnimationFrame(frame);
  }
  g.fillStyle = '#120a35'; g.fillRect(0, 0, W, H);
  requestAnimationFrame(frame);

  function pintarLetras() { $('#letras').innerHTML = LETRAS.map(l => `<button data-l="${l}" class="${l === state.letra ? 'on' : ''}">${l}</button>`).join(''); }
  $('#modos').addEventListener('click', e => {
    const b = e.target.closest('[data-modo]'); if (!b) return;
    state.modo = b.dataset.modo; [...$('#modos').children].forEach(x => x.classList.toggle('on', x === b));
    $('#letras').hidden = state.modo !== 'letra'; pintarLetras(); J.sfx('pop');
    if (state.modo === 'letra') { J.say(['La letra del día']); if (LETRAS.slice(0, 5).includes(state.letra)) J.say(state.letra, { queue: true }); else J.sound(state.letra); }
  });
  $('#letras').addEventListener('click', e => {
    const b = e.target.closest('[data-l]'); if (!b) return;
    state.letra = b.dataset.l; pintarLetras();
    lanzar(W / 2, H * .38, state.letra);
  });

  (async () => {
    await J.ready;
    updatePlayer(); J.refreshMusic();
    setTimeout(() => J.say('¡Toca el cielo!'), 500);
    if (location.hash === '#prueba') window.__f = { state, lanzar };
  })();
})();
</script>
</body>
</html>
