<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Revienta Globos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<link rel="stylesheet" href="css/juego3d.css">
<style>
body { background: linear-gradient(#7fc8f8, #ffe1f0 75%); }
#nivel-desc { font-size: 17px; color: #5b6b82; min-height: 1.3em; }
canvas.mundo { cursor: crosshair; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<script src="js/comun.js"></script>
</head>
<body>
<canvas class="mundo" id="mundo" aria-label="Globos de colores subiendo frente a un castillo"></canvas>
<div class="hud">
  <div class="hud-side">
    <a class="round-btn btn" href="index.html" aria-label="Volver al inicio">🏠</a>
    <div class="pill">Nivel <span id="nivel-num">1</span></div>
  </div>
  <div class="hud-side">
    <button class="round-btn" data-musica aria-label="Música">🎵</button>
    <div class="pill" id="jugador"></div>
  </div>
</div>
<div class="mision" id="mision" hidden>
  <span class="etq" id="m-etq">Revienta</span>
  <span class="word" id="m-word"></span>
  <button id="m-say" aria-label="Escuchar otra vez">🔊</button>
</div>
<div class="metas" id="metas"></div>
<div id="mensaje" aria-live="polite"></div>

<div class="portada" id="portada">
  <div class="portada-caja">
    <div style="font-size:64px;line-height:1">🎈🎈🎈</div>
    <h1>Revienta Globos</h1>
    <p>Escucha y <b>toca el globo</b> que tiene la letra, la sílaba o la palabra.</p>
    <div class="niveles" id="niveles" aria-label="Elige el nivel"></div>
    <div id="nivel-desc"></div>
    <button class="go" id="empezar" disabled>Cargando…</button>
  </div>
</div>
<script type="module" src="js/globos.js"></script>
</body>
</html>
