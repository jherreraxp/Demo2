<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Elige tu Personaje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<link rel="stylesheet" href="css/juego3d.css">
<style>
body { background: #bfe6ff; }
.acciones { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.acciones .btn { font-size: 20px; padding: 8px 18px; border-radius: 999px; background: #fff; box-shadow: 0 4px 0 var(--shadow); font-weight: 800; text-decoration: none; color: inherit; }
.titulo { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 66px); text-align: center; z-index: 5; pointer-events: none; }
.titulo h1 { margin: 0; font-size: clamp(28px, 7vw, 44px); line-height: 1.05; }
.tabs { display: inline-flex; gap: 8px; margin-top: 6px; pointer-events: auto; }
.tabs button { background: rgba(255,255,255,.6); border-radius: 999px; padding: 4px 16px; font-size: 20px; font-weight: 800; }
.tabs button.on { background: #fff; box-shadow: 0 4px 0 var(--shadow); }
.abajo { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; flex-direction: column; gap: 12px; align-items: center; z-index: 5; }
.nombres { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 5px; width: 100%; max-width: 1100px; max-height: 26vh; overflow-y: auto; padding: 2px 2px 6px; }
.nombres button { background: rgba(255,255,255,.75); border-radius: 14px; padding: 3px 4px; font-size: 13px; font-weight: 800; line-height: 1.05; box-shadow: 0 3px 0 var(--shadow); display: flex; align-items: center; gap: 4px; text-align: left; }
.nombres button span { display: block; font-size: 22px; flex: none; }
.nombres button.on { background: var(--gold); }
.estilos { display: inline-flex; gap: 8px; margin-top: 6px; pointer-events: auto; }
.estilos button { display: flex; flex-direction: column; align-items: center; gap: 0; background: rgba(255,255,255,.7); border-radius: 18px; padding: 4px 10px 6px; font-size: 15px; font-weight: 800; box-shadow: 0 4px 0 var(--shadow); min-width: 78px; }
.estilos button img, .estilos button .ph { width: 52px; height: 62px; display: block; }
.estilos button .ph { font-size: 34px; line-height: 62px; }
.estilos button.on { background: var(--gold); transform: translateY(-2px); }
@media (max-width: 520px) { .estilos button { min-width: 64px; padding: 3px 6px 5px; font-size: 13px; } .estilos button img, .estilos button .ph { width: 40px; height: 48px; } .estilos button .ph { line-height: 48px; font-size: 28px; } .nombres { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); max-height: 20vh; } .nombres button { font-size: 11px; } .nombres button span { font-size: 18px; } }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<script src="js/comun.js"></script>
<script src="js/tema.js"></script>
</head>
<body>
<canvas class="parque" id="parque" aria-hidden="true"></canvas>
<canvas class="mundo" id="mundo" aria-label="Personajes en un escenario"></canvas>
<div class="hud">
  <div class="hud-side"><a class="round-btn btn" href="index.html" aria-label="Volver al inicio">🏠</a></div>
  <div class="hud-side"><button class="round-btn" data-musica aria-label="Música">🎵</button></div>
</div>
<div class="titulo">
  <h1>Elige tu personaje</h1>
  <div class="tabs" id="tabs" hidden></div>
  <div><div class="estilos" id="estilos" aria-label="Estilo de los personajes"></div></div>
</div>
<div class="abajo">
  <div class="nombres" id="nombres"></div>
  <div class="acciones">
    <a class="btn" id="a-pintar" href="princesa.html">🎨 Pintar</a>
    <a class="btn" id="a-cuidar" href="cuidar.html">🛁 Cuidar y jugar</a>
    <a class="btn" id="a-taller" href="editor.html">🧵 Crear y cambiar</a>
    <a class="go btn" href="index.html" id="listo">✔ ¡Listo!</a>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { crearMundo, chispitas } from './js/mundo3d.js';
import { crearPersonaje, PERSONAJES, ESTILOS, EMOJI, FIGURAS, nombrePersonaje, estiloActual } from './js/personajes.js';
import { pintarParque } from './js/parque.js';
pintarParque(document.querySelector('#parque'));

const J = window.Juego, P = J.progress;
const $ = s => document.querySelector(s);
// nombre y dibujito de cada personaje (los nuevos animalitos pueden no estar todavía en la lista del juego)
const info = id => J.CHARS[id] || { name: nombrePersonaje(id), emoji: EMOJI[id] || '⭐' };
const volver = new URLSearchParams(location.search).get('volver');
if (volver && /^[a-z]+\.html$/.test(volver)) $('#listo').href = volver;

const W = crearMundo($('#mundo'), { fog: null });
const { scene, camera } = W;
W.fovFor = a => a < .8 ? 60 : 44;
camera.position.set(0, 2.2, 7.5); camera.lookAt(0, 1.1, 0);
const fx = chispitas(scene);

// escenario: piso redondo y focos
const stage = new THREE.Mesh(new THREE.CylinderGeometry(9, 9.3, .4, 48), new THREE.MeshStandardMaterial({ color: 0x8fd46a, roughness: .8 }));
stage.position.y = -.2; stage.receiveShadow = true; scene.add(stage);
const cols = [0x8fd3f4, 0xffd23f, 0xb07de8, 0x4cb87a, 0xff4fa3, 0xffe3a8, 0xef5b5b, 0x9aa3ad, 0xff9a5a, 0xc9d1dc, 0xd8b48f];
const chars = [];
let editing = 0; // jugador que está eligiendo

const narrow = () => innerWidth / innerHeight < .8;
// escenario en filas: 8 por fila en pantallas anchas, 4 en el celular
function layout() {
  const n = narrow(), perRow = n ? 4 : 8, gap = n ? 1.7 : 1.8, rowGap = n ? 2.1 : 2.1;
  const rows = Math.ceil(chars.length / perRow);
  chars.forEach((c, i) => {
    const r = Math.floor(i / perRow), inRow = Math.min(perRow, chars.length - r * perRow), k = i % perRow;
    c.base.position.set((k - (inRow - 1) / 2) * gap + (r % 2 ? gap * .25 : 0), 0, (r - (rows - 1) / 2) * rowGap);
  });
  const far = n ? 9 + rows * 1.4 : 7 + rows * 1.5;
  camera.position.set(0, n ? 4 + rows * 1.3 : 3.5 + rows * .9, far); camera.lookAt(0, n ? -.2 : .5, n ? 1.2 : .3);
}
addEventListener('resize', layout);

// arma (o vuelve a armar) a todos los personajes con el estilo elegido
async function armar(soloHumanos = false) {
  for (const [i, id] of PERSONAJES.entries()) {
    let c = chars.find(x => x.id === id);
    if (c && soloHumanos && !FIGURAS[id]) continue;
    if (!c) {
      const base = new THREE.Group(); scene.add(base);
      const ped = new THREE.Mesh(new THREE.CylinderGeometry(.68, .72, .16, 32), new THREE.MeshStandardMaterial({ color: cols[i % cols.length], roughness: .4 }));
      ped.position.y = .08; ped.receiveShadow = true; base.add(ped);
      c = { id, base, ped }; chars.push(c);
    }
    if (c.ch) c.base.remove(c.ch.group);
    c.ch = await crearPersonaje(id);
    c.ch.group.scale.multiplyScalar(.9);
    c.ch.group.position.y = .16; c.base.add(c.ch.group);
  }
  layout();
}
await armar();

// botones de estilo con una fotito del personaje en cada estilo
const fotosEstilo = {};
async function hacerFotos() {
  const id = FIGURAS[P.players[editing].char] ? P.players[editing].char : 'nieve';
  const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  r.setSize(104, 124); r.setPixelRatio(1); r.outputColorSpace = THREE.SRGBColorSpace;
  const sc = new THREE.Scene(); sc.add(new THREE.HemisphereLight(0xffffff, 0xd8c8ff, 2.2));
  const l = new THREE.DirectionalLight(0xffffff, 1.6); l.position.set(2, 4, 5); sc.add(l);
  const cam = new THREE.PerspectiveCamera(30, 104 / 124, .1, 50); cam.position.set(0, 1.15, 4.6); cam.lookAt(0, 1.0, 0);
  for (const est of Object.keys(ESTILOS)) {
    const d = await crearPersonaje(id, '', { estilo: est }); sc.add(d.group);
    for (let i = 0; i < 10; i++) d.update(.05, 'quieto');
    r.render(sc, cam); fotosEstilo[est] = r.domElement.toDataURL(); sc.remove(d.group);
  }
  r.dispose(); renderEstilos();
}
function renderEstilos() {
  const cur = estiloActual();
  $('#estilos').innerHTML = Object.entries(ESTILOS).map(([k, e]) => `<button data-est="${k}" class="${k === cur ? 'on' : ''}" aria-label="Estilo ${e.nombre}">${fotosEstilo[k] ? `<img src="${fotosEstilo[k]}" alt="">` : `<span class="ph">${e.emoji}</span>`}${e.nombre}</button>`).join('');
}
renderEstilos(); hacerFotos().catch(() => {});
$('#estilos').addEventListener('click', async e => {
  const b = e.target.closest('[data-est]'); if (!b || b.dataset.est === estiloActual()) return;
  P.estilo = b.dataset.est; J.save(); J.sfx('pop'); renderEstilos();
  await armar(true);
  fx.burst(new THREE.Vector3(0, 1.5, 0), 60, 2); J.sparkle();
});

function render() {
  const two = P.two;
  $('#tabs').hidden = !two;
  $('#tabs').innerHTML = P.players.map((p, i) => `<button class="${i === editing ? 'on' : ''}" data-p="${i}">${J.esc(p.name)}</button>`).join('');
  const id = P.players[editing].char;
  $('#a-pintar').href = 'princesa.html?p=' + id;
  $('#a-cuidar').href = 'cuidar.html?p=' + id;
  $('#a-taller').href = 'editor.html?p=' + id;
  $('#nombres').innerHTML = PERSONAJES.map(id => `<button data-id="${id}" class="${P.players[editing].char === id ? 'on' : ''}"><span>${info(id).emoji}</span>${info(id).name}</button>`).join('');
}
function pick(id) {
  P.players[editing].char = id; J.save();
  const c = chars.find(c => c.id === id);
  fx.burst(c.base.position.clone().add(new THREE.Vector3(0, 1.5, 0)), 40);
  J.cheer(); J.say([P.players[editing].name, 'es', info(id).name], { queue: true });
  if (FIGURAS[id]) hacerFotos().catch(() => {});
  render();
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) { editing = +b.dataset.p; J.sfx('pop'); render(); } });
$('#nombres').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) pick(b.dataset.id); });

const ray = new THREE.Raycaster(), v2 = new THREE.Vector2();
$('#mundo').addEventListener('pointerdown', e => {
  v2.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(v2, camera);
  for (const c of chars) { if (ray.intersectObject(c.base, true).length) { pick(c.id); break; } }
});

W.onFrame((dt, t) => {
  for (const c of chars) {
    if (!c.ch) continue;
    const mine = P.players[editing].char === c.id;
    c.ch.update(dt, mine ? 'festejar' : 'bailar');
    c.ped.material.emissive = new THREE.Color(mine ? 0x664400 : 0x000000);
    c.base.rotation.y = mine ? 0 : Math.sin(t * .8 + c.base.position.x) * .3;
  }
  fx.update(dt);
});
render(); J.refreshMusic(); W.start();
setTimeout(() => J.say('¡Elige tu personaje!'), 400);
</script>
</body>
</html>
