<style>
/* vestidor: telón azul → violeta con rayos de luz; el color de acento sale del tema elegido */
:root { --v-1: #4f86ff; --v-2: #3a2bbd; --v-3: #160b52; --v-acento: var(--tema-acento, #7b5cff); --v-pop: #ffe14a; --v-pop2: #ffb21a; --v-tinta: #1b1464; }
@supports (color: color-mix(in srgb, red, blue)) {
  :root { --v-1: color-mix(in srgb, var(--tema-bg1, #4f86ff) 26%, #3f7dff); --v-2: color-mix(in srgb, var(--tema-acento, #3a2bbd) 22%, #3a2bbd); }
}
body { background: var(--v-3); overflow: hidden; }
canvas.mundo { touch-action: none; cursor: grab; }

.telon::before, .telon::after { content: ""; position: absolute; top: -22%; width: 30vmax; height: 130%; background: linear-gradient(180deg, rgba(255,255,255,.26), rgba(255,255,255,0) 78%); filter: blur(22px); animation: rayo 7s ease-in-out infinite alternate; }
.telon::before { left: 4%; transform: rotate(-17deg); } .telon::after { right: 4%; transform: rotate(17deg); animation-delay: -3.5s; }
@keyframes rayo { from { opacity: .35; } to { opacity: .85; } }
@media (prefers-reduced-motion: reduce) { .telon::before, .telon::after { animation: none; opacity: .6; } }
/* oscurece un poco las orillas para que el del centro resalte */
.foco { position: fixed; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(ellipse 46% 62% at 50% 54%, rgba(10,6,50,0) 55%, rgba(10,6,50,.42) 100%); }
.arriba { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }

.quien { display: inline-flex; gap: 6px; background: rgba(12,8,70,.4); padding: 4px; border-radius: 999px; border: 2px solid rgba(255,255,255,.28); }

.cats { display: flex; gap: 6px; overflow-x: auto; max-width: calc(100vw - 24px); padding: 2px 4px 6px; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cats button { flex: none; border-radius: 12px; padding: 6px 14px; font-size: 16px; font-weight: 800; color: #fff; background: rgba(12,8,70,.38); border: 2px solid rgba(255,255,255,.3); box-shadow: 0 3px 0 rgba(10,6,60,.35); white-space: nowrap; }
.cats button.on { background: var(--v-pop); border-color: #fff; color: var(--v-tinta); }
.seg { display: inline-flex; background: rgba(12,8,70,.38); border: 2px solid rgba(255,255,255,.25); border-radius: 14px; padding: 3px; gap: 2px; }
.seg button { border-radius: 10px; padding: 4px 10px; font-size: 14px; font-weight: 800; background: transparent; color: #fff; display: flex; align-items: center; gap: 4px; }
.seg button.on { background: #fff; color: var(--v-tinta); box-shadow: 0 2px 0 rgba(10,6,60,.4); }
.flecha { position: fixed; top: 50%; transform: translateY(-50%); z-index: 6; width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,.16); border: 3px solid rgba(255,255,255,.7); font-size: 32px; font-weight: 800; box-shadow: 0 5px 0 rgba(10,6,60,.4); color: #fff; }
.flecha:active { transform: translateY(-46%); box-shadow: 0 2px 0 rgba(10,6,60,.4); background: var(--v-pop); color: var(--v-tinta); }

.gestos { display: flex; gap: 8px; max-width: min(100vw, 780px); overflow-x: auto; padding: 8px 20px 4px; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, transparent, #000 20px, #000 calc(100% - 20px), transparent); mask-image: linear-gradient(90deg, transparent, #000 20px, #000 calc(100% - 20px), transparent); }
.gestos::-webkit-scrollbar { display: none; }
.gestos button { flex: none; width: 58px; height: 58px; border-radius: 50%; font-size: 28px; line-height: 1; display: grid; place-items: center; background: radial-gradient(circle at 35% 26%, rgba(255,255,255,.42), rgba(255,255,255,.12) 62%); border: 2.5px solid rgba(255,255,255,.6); box-shadow: 0 4px 0 rgba(10,6,60,.45); transition: transform .15s, background .15s; }

.nombre { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px 44px 2px; max-width: 100vw; background: linear-gradient(90deg, rgba(14,8,70,0), rgba(14,8,70,.5) 20%, rgba(14,8,70,.5) 80%, rgba(14,8,70,0)); }
.nombre .nom { font: italic 800 clamp(30px, 8vw, 56px)/1 "Baloo 2", system-ui, sans-serif; text-transform: uppercase; letter-spacing: .5px; color: #fff; text-shadow: 0 3px 0 rgba(16,8,80,.65), 0 0 22px rgba(130,170,255,.55); white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; }
.nombre .nom small { font-size: .55em; font-style: normal; margin-right: 8px; vertical-align: .12em; }

.r-azul { --r: linear-gradient(135deg, #39b6ff, #2a6bff); } .r-verde { --r: linear-gradient(135deg, #5fe08a, #1fae5b); }
.r-oro { --r: linear-gradient(135deg, #ffe14a, #ff9a2e); } .r-oro.rareza { color: #5a2d00; }
.r-rosa { --r: linear-gradient(135deg, #ff8ad8, #c94dff); } .r-morado { --r: linear-gradient(135deg, #b58cff, #7b4dff); }
.puntos { display: flex; gap: 5px; color: #fff; }
.puntos i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.35); }
.puntos i.on { background: var(--v-pop); width: 20px; border-radius: 4px; }
.elegir { font: italic 800 28px/1 "Baloo 2", system-ui, sans-serif; text-transform: uppercase; letter-spacing: .5px; padding: 14px 50px; border-radius: 16px; background: linear-gradient(180deg, #fff27a, var(--v-pop) 45%, var(--v-pop2)); color: var(--v-tinta); box-shadow: 0 6px 0 #b97a00, 0 0 26px rgba(255,225,74,.45); }
.elegir:active:not(:disabled) { box-shadow: 0 1px 0 #b97a00; }
.elegir.bloq { background: #8a7fb0; color: #fff; box-shadow: 0 6px 0 #5f5585; font-size: 20px; }
.elegir.ya { background: linear-gradient(180deg, #7dea9f, #3fc474); color: #0c3b22; box-shadow: 0 6px 0 #2e8a55; }
.banner-regalo { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 172px); transform: translateX(-50%); z-index: 8; background: repeating-linear-gradient(45deg, #ffd23f 0 14px, #ffe27a 14px 28px); color: #5a2d00; font: 800 clamp(20px, 4.4vw, 28px) "Baloo 2", system-ui, sans-serif; border-radius: 999px; padding: 8px 24px; box-shadow: 0 5px 0 rgba(10,6,60,.4); transition: opacity .6s; pointer-events: none; white-space: nowrap; }

#aviso-plan { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translate(-50%, 140%); z-index: 30; background: #23324a; color: #fff; border-radius: 16px; padding: 12px 16px; font: 700 15px system-ui, sans-serif; transition: transform .3s; max-width: 90vw; }
#aviso-plan.ver { transform: translate(-50%, 0); } #aviso-plan a { color: #ffd23f; }
.secund { display: flex; gap: 12px; padding-bottom: 14px; }
.secund a { width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,.16); border: 2.5px solid rgba(255,255,255,.6); box-shadow: 0 4px 0 rgba(10,6,60,.45); display: grid; place-items: center; font-size: 25px; text-decoration: none; position: relative; }

.vacio { position: fixed; left: 50%; top: 48%; transform: translate(-50%, -50%); z-index: 5; background: #fff; border-radius: 20px; padding: 16px 22px; font-weight: 800; text-align: center; box-shadow: 0 6px 0 rgba(10,6,60,.4); }
@media (max-width: 560px) {
  .arriba { top: calc(env(safe-area-inset-top, 0px) + 66px); } .arriba h1 { display: none; }
  .flecha { width: 52px; height: 52px; font-size: 24px; top: 42%; }
  .abajo { gap: 6px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
  .gestos button { width: 52px; height: 52px; font-size: 25px; }
  .elegir { font-size: 24px; padding: 12px 40px; } .elegir.bloq { font-size: 17px; padding: 12px 22px; }
  .secund a { width: 46px; height: 46px; font-size: 21px; } .seg button { padding: 3px 7px; font-size: 13px; }
  .rareza { font-size: 11px; padding: 3px 9px; }
  .banner-regalo { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 330px); font-size: 17px; padding: 6px 16px; }
}
/* pantallas anchas: los gestos van en una rueda a la derecha y los botones chicos abajo a la izquierda, para dejar libre al personaje */
@media (min-width: 900px) and (min-height: 561px) {
  .gestos { position: fixed; right: 104px; top: 52%; transform: translateY(-50%); display: grid; grid-template-columns: repeat(2, 58px); gap: 10px; max-width: none; overflow: visible; padding: 0; -webkit-mask-image: none; mask-image: none; }
  .secund { position: fixed; left: 28px; bottom: 36px; padding: 0; }
  .abajo { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 30px); }
}
@media (max-height: 560px) {

  .gestos button { width: 44px; height: 44px; font-size: 21px; } .palabra { position: fixed; bottom: 46%; }
  .nombre .nom { font-size: 30px; } .elegir { font-size: 20px; padding: 9px 30px; } .abajo { padding-bottom: 10px; gap: 4px; }
}
</style>

<body>

  </div>

<script type="module">
import * as THREE from 'three';
import { crearMundo, chispitas } from './js/mundo3d.js';
import { crearPersonaje, PERSONAJES, ESTILOS, EMOJI, EMOTES, FIGURAS, nombrePersonaje, estiloActual, esPropio, esPremium } from './js/personajes.js';

const J = window.Juego, P = J.progress;
const $ = s => document.querySelector(s);
const info = id => J.CHARS[id] || { name: nombrePersonaje(id), emoji: EMOJI[id] || '⭐' };
const volver = new URLSearchParams(location.search).get('volver');
const destino = volver && /^[a-z]+\.html$/.test(volver) ? volver : 'index.html';

// grupos cortos, en vez de 22 botones
const CHICAS = ['nieve', 'ana', 'estrella', 'zoe', 'mira', 'amara', 'nieve_gala', 'estrella_gira', 'ana_dorada', 'mila_guerrera'], FAMILIA = ['amara', 'mama', 'papa'];
const CATS = [
  { id: 'todos', nombre: '⭐ Todos', f: () => true },
  { id: 'chicas', nombre: '👸 Princesas y chicas', f: id => CHICAS.includes(id) },
  { id: 'familia', nombre: '👨‍👩‍👧 Familia', f: id => FAMILIA.includes(id) },
  { id: 'animales', nombre: '🐾 Animalitos', f: id => !FIGURAS[id] && !esPropio(id) || ['raton', 'rojito'].includes(id) },
  { id: 'mios', nombre: '🧵 Mis creados', f: id => esPropio(id) },
];
let cat = 'todos', editing = 0, lista = [], idx = 0;
// trajes especiales: se eligen con el plan Familia (sin servidor, como en la copia de GitHub, están libres)
const plan = () => (window.Cuenta && window.Cuenta.personalizacion ? window.Cuenta.personalizacion() : 'completa');
const bloqueado = id => esPremium(id) && plan() !== 'completa';
// ?regalo=<id>: el regalo sorpresa deja mirar (no elegir) un personaje bloqueado
const qs = new URLSearchParams(location.search);
const regaloId = qs.get('regalo') && PERSONAJES.includes(qs.get('regalo')) ? qs.get('regalo') : null;
let regaloT = regaloId ? 9 : 0;

// ---------- escena: vestidor con una tornamesa luminosa al centro ----------
const W = crearMundo($('#mundo'), { fog: null });
const { scene, camera } = W;
W.fovFor = a => a < .8 ? 52 : 38;
const fx = chispitas(scene);
const TAU = Math.PI * 2;
const narrow = () => innerWidth / innerHeight < .8;
function encuadre() { const n = narrow(); camera.position.set(0, n ? 2.0 : 1.75, n ? 8.9 : 7.4); camera.lookAt(0, n ? .8 : 1.15, 0); }
encuadre(); addEventListener('resize', encuadre);
// luces de estudio: el cielo y el suelo tiñen de azul y violeta, y dos contraluces dibujan el contorno
const cielo = scene.children.find(o => o.isHemisphereLight); if (cielo) { cielo.groundColor.set(0x7a5cff); cielo.intensity = 1.55; }
const contra = new THREE.DirectionalLight(0x9fd0ff, 1.7); contra.position.set(-4, 5, -6); scene.add(contra);
const contra2 = new THREE.DirectionalLight(0xff9ae0, 1.1); contra2.position.set(5, 3, -5); scene.add(contra2);
const matPed = (c, e = 0, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .35, metalness: .25, emissive: e, emissiveIntensity: .6, ...o });
// resplandor del piso
const cg = document.createElement('canvas'); cg.width = cg.height = 256;
{ const g = cg.getContext('2d'), gr = g.createRadialGradient(128, 128, 8, 128, 128, 127); gr.addColorStop(0, 'rgba(215,230,255,.95)'); gr.addColorStop(.3, 'rgba(150,180,255,.5)'); gr.addColorStop(.62, 'rgba(140,110,255,.16)'); gr.addColorStop(1, 'rgba(140,110,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 256, 256); }
const brilloPiso = new THREE.Mesh(new THREE.PlaneGeometry(11, 11), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cg), transparent: true, depthWrite: false }));
brilloPiso.rotation.x = -Math.PI / 2; brilloPiso.position.y = .004; brilloPiso.renderOrder = -3; scene.add(brilloPiso);
// tornamesa: gira despacito sola y también se puede girar con el dedo
const plato = new THREE.Group(); scene.add(plato);
const pBase = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.44, .2, 56), matPed(0x1f2390)); pBase.position.y = .1; pBase.receiveShadow = true; plato.add(pBase);
const pTapa = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.22, .08, 56), matPed(0x4a5cf0, 0x1a2bb0)); pTapa.position.y = .24; pTapa.receiveShadow = true; plato.add(pTapa);
const anillo = new THREE.Mesh(new THREE.TorusGeometry(1.24, .045, 10, 72), new THREE.MeshStandardMaterial({ color: 0xffe14a, emissive: 0xffc400, emissiveIntensity: .9 }));
anillo.rotation.x = Math.PI / 2; anillo.position.y = .26; plato.add(anillo);
const matFoco = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xbfe0ff, emissiveIntensity: 1.2 }), geoFoco = new THREE.SphereGeometry(.035, 10, 8), geoRaya = new THREE.BoxGeometry(.05, .006, .42);
const matRaya = new THREE.MeshStandardMaterial({ color: 0x8fa2ff, emissive: 0x5a6dff, emissiveIntensity: .7 });
for (let i = 0; i < 16; i++) {
  const a = i / 16 * TAU, f = new THREE.Mesh(geoFoco, matFoco); f.position.set(Math.sin(a) * 1.37, .15, Math.cos(a) * 1.37); plato.add(f);
  if (i % 2 === 0) { const r = new THREE.Mesh(geoRaya, matRaya); r.position.set(Math.sin(a) * .9, .282, Math.cos(a) * .9); r.rotation.y = a; plato.add(r); }
}
const luz = new THREE.SpotLight(0xffffff, 55, 14, .42, .6, 1.2); luz.position.set(0, 7, 2.5); luz.target.position.set(0, 0, 0); scene.add(luz, luz.target);
// rayos de luz que bajan al escenario
const haz = (x, inc, color, op) => { const m = new THREE.Mesh(new THREE.ConeGeometry(1.55, 8, 36, 1, true), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: op, depthWrite: false, side: THREE.DoubleSide })); m.position.set(x, 4.1, x ? -1.2 : 0); m.rotation.z = inc; m.userData.op = op; m.userData.inc = inc; scene.add(m); return m; };
const rayos = [haz(0, 0, 0xfff6cc, .1), haz(-3.1, -.42, 0x9fd0ff, .07), haz(3.1, .42, 0xd9b0ff, .07)];
// pedestales de los vecinos (2 a cada lado)
const LADO = [-2, -1, 1, 2];
const posDe = o => ({ x: o * (narrow() ? 1.55 : 2.2), z: -Math.abs(o) * 1.15, s: o === 0 ? 1 : Math.abs(o) === 1 ? .6 : .44 });
const pedVecinos = LADO.map(o => { const m = new THREE.Mesh(new THREE.CylinderGeometry(.75, .84, .18, 36), matPed(0x3a34b8, 0x2a1f9a)); m.receiveShadow = true; scene.add(m); return { o, m }; });
// giro de la tornamesa
let yaw = 0, yawV = 0, pausa = 0, gestoT = 0;

// ---------- personajes: solo se arman los 5 que se ven ----------
const cache = new Map(); // clave id|estilo → { ch, t }
const visibles = new Map(); // offset → { id, g }
let armando = 0;
async function personaje(id) {
  const k = id + '|' + estiloActual();
  let c = cache.get(k);
  if (!c) { const ch = await crearPersonaje(id); ch.group.traverse(o => { if (o.isMesh) o.castShadow = true; }); c = { ch }; cache.set(k, c); }
  c.t = performance.now();
  // se liberan los que hace rato no se ven (quedan máx. 12)
  if (cache.size > 12) {
    const vivos = new Set([...visibles.values()].map(v => v.k));
    [...cache.entries()].filter(([kk]) => !vivos.has(kk) && kk !== k).sort((a, b) => a[1].t - b[1].t).slice(0, cache.size - 12).forEach(([kk, v]) => {
      v.ch.group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) [].concat(o.material).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); }); });
      cache.delete(kk);
    });
  }
  return { ch: c.ch, k };
}
async function colocar() {
  const turno = ++armando;
  const n = lista.length;
  $('#vacio').hidden = !!n;
  if (!n) { visibles.forEach(v => scene.remove(v.ch.group)); visibles.clear(); $('#vacio').innerHTML = 'Todavía no hay personajes creados.<br><a href="editor.html">🧵 ¡Crea uno!</a>'; return; }
  const quieren = new Map();
  for (const o of [0, -1, 1, -2, 2]) {
    if (n < 2 && o) continue; if (n === 2 && o === -1) continue; if (n < 5 && Math.abs(o) === 2) continue;
    quieren.set(o, lista[(idx + o + n * 10) % n]);
  }
  pedVecinos.forEach(p => { p.m.visible = quieren.has(p.o); });
  for (const [o, id] of quieren) {
    const r = await personaje(id); if (turno !== armando) return;
    const prev = visibles.get(o);
    if (prev && prev.k === r.k) continue;
    if (prev) scene.remove(prev.ch.group);
    // si ya estaba en otro lugar, viaja desde ahí (deslizamiento suave)
    const antes = [...visibles.entries()].find(([oo, v]) => v.k === r.k && oo !== o);
    if (antes) visibles.delete(antes[0]);
    scene.add(r.ch.group);
    if (!antes) { const p = posDe(o + (o >= 0 ? .6 : -.6)); r.ch.group.position.set(p.x, 0, p.z); }
    visibles.set(o, { id, k: r.k, ch: r.ch, llego: o === 0 ? 1.6 : 0 });
  }
  for (const [o, v] of [...visibles]) if (!quieren.has(o)) { scene.remove(v.ch.group); visibles.delete(o); }
}

// ---------- interfaz ----------
const elegido = () => P.players[editing].char;
function renderCats() {
  $('#cats').innerHTML = CATS.filter(c => c.id !== 'mios' || PERSONAJES.some(esPropio)).map(c => `<button role="tab" data-cat="${c.id}" class="${c.id === cat ? 'on' : ''}" aria-selected="${c.id === cat}">${c.nombre}</button>`).join('');
}
function renderEstilos() {
  const cur = estiloActual();
  $('#estilos').innerHTML = Object.entries(ESTILOS).map(([k, e]) => `<button data-est="${k}" class="${k === cur ? 'on' : ''}">${e.emoji} ${e.nombre}</button>`).join('');
}
function renderQuien() {
  $('#quien').hidden = !P.two;
  $('#quien').innerHTML = P.players.map((p, i) => `<button data-p="${i}" class="${i === editing ? 'on' : ''}">${J.esc(J.CHARS[p.char]?.emoji || '⭐')} ${J.esc(p.name)}</button>`).join('');
}
// etiqueta de colección (como la "rareza" de los juegos)
function rareza(id) {
  if (esPremium(id)) return { c: 'oro', t: (bloqueado(id) ? '🔒' : '⭐') + ' Plan Familia' };
  if (esPropio(id)) return { c: 'rosa', t: '🧵 Hecho por ti' };
  if (CATS[3].f(id)) return { c: 'verde', t: '🐾 Animalito' };
  if (FAMILIA.includes(id)) return { c: 'morado', t: '💞 Familia' };
  return { c: 'azul', t: '✨ Clásico' };
}
function renderGestos() {
  $('#gestos').innerHTML = Object.entries(EMOTES).map(([k, e]) => `<button data-g="${k}" aria-label="${e.nombre}" title="${e.nombre}">${e.emoji}</button>`).join('');
}
let palabraT = null;
function gesto(id) {
  const v = visibles.get(0), e = EMOTES[id]; if (!v || !e || !v.ch.emote) return 0;
  const d = v.ch.emote(id); if (!d) return 0;
  gestoT = d; v.llego = 0;
  if (id === 'corazon' || id === 'estrella' || id === 'girar') J.sparkle(); else J.sfx('pop', .6, 1.2);
  if (id === 'aplauso' || id === 'estrella') fx.burst(new THREE.Vector3(0, 2, 0), 30, 1);
  J.say(e.nombre);
  $('#gestos').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.g === id));
  $('#palabra').textContent = e.emoji + ' ' + e.nombre; $('#palabra').classList.add('ver');
  clearTimeout(palabraT); palabraT = setTimeout(() => { $('#palabra').classList.remove('ver'); $('#gestos').querySelectorAll('.on').forEach(b => b.classList.remove('on')); }, d * 1000);
  return d;
}
function renderInfo() {
  const id = lista[idx]; if (!id) { $('#nombre').hidden = true; $('#gestos').hidden = true; return; }
  $('#nombre').hidden = false;
  const lock = bloqueado(id);
  const r = rareza(id);
  $('#nombre').className = 'nombre r-' + r.c;
  $('#nombre').innerHTML = `<span class="rareza r-${r.c}">${r.t}</span><span class="nom"><small>${info(id).emoji}</small>${J.esc(info(id).name)}</span><span class="raya"></span>`;
  $('#gestos').hidden = false;
  const n = lista.length, MAX = 12;
  $('#puntos').innerHTML = n <= MAX ? lista.map((_, i) => `<i class="${i === idx ? 'on' : ''}"></i>`).join('') : `<span style="font-weight:800">${idx + 1} / ${n}</span>`;
  const ya = elegido() === id;
  $('#elegir').textContent = lock ? '🔒 Con el plan Familia' : ya ? '✔ ¡Es tu personaje!' : '¡Elegir!';
  $('#elegir').classList.toggle('ya', ya && !lock);
  $('#elegir').classList.toggle('bloq', lock);
  $('#a-pintar').href = 'princesa.html?p=' + id; $('#a-cuidar').href = 'cuidar.html?p=' + id; $('#a-taller').href = 'editor.html?p=' + id;
  $('#prev').hidden = $('#next').hidden = n < 2;
}
let decirT = null;
function mover(d, silencio = false) {
  const n = lista.length; if (n < 2) return;
  idx = (idx + d + n) % n;
  yaw = 0; yawV = 0; pausa = 0; gestoT = 0; $('#palabra').classList.remove('ver');
  J.sfx('pop', .5, 1 + d * .08);
  renderInfo(); colocar();
  clearTimeout(decirT); if (!silencio) decirT = setTimeout(() => J.say(info(lista[idx]).name), 280);
}
function usarCategoria(c, centrarEn) {
  cat = c; const f = CATS.find(x => x.id === c).f;
  lista = PERSONAJES.filter(id => f(id));
  const i = lista.indexOf(centrarEn || elegido()); idx = i >= 0 ? i : 0;
  renderCats(); renderInfo(); colocar();
}
function avisoPlan() {
  J.sfx('pop'); J.say('Con el plan Familia');
  if (window.Cuenta && window.Cuenta.avisoDemo) window.Cuenta.avisoDemo('Este traje especial es del plan Familia. Pide a papá o mamá que lo vean en la cuenta.');
  else { let t = $('#aviso-plan'); if (!t) { t = document.createElement('div'); t.id = 'aviso-plan'; document.body.appendChild(t); } t.innerHTML = '🔒 Este traje especial es del plan Familia. <a href="cuenta.html">Ver plan</a>'; t.classList.add('ver'); clearTimeout(avisoPlan.t); avisoPlan.t = setTimeout(() => t.classList.remove('ver'), 6000); }
}
function elegir() {
  const id = lista[idx]; if (!id) return;
  if (bloqueado(id)) return avisoPlan();
  if (elegido() === id) { location.href = destino; return; }
  P.players[editing].char = id; J.save();
  fx.burst(new THREE.Vector3(0, 1.6, 0), 60, 1.2); J.cheer();
  const v = visibles.get(0); if (v) v.llego = 2.2;
  J.say([P.players[editing].name, 'es', info(id).name], { queue: true });
  renderInfo(); renderQuien();
}
$('#prev').onclick = () => mover(-1);
$('#next').onclick = () => mover(1);
$('#elegir').onclick = elegir;
$('#nombre').onclick = () => J.say(info(lista[idx]).name);
$('#gestos').addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (b) gesto(b.dataset.g); });
$('#cats').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (b && b.dataset.cat !== cat) { J.sfx('pop'); usarCategoria(b.dataset.cat, lista[idx]); } });
$('#quien').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (!b) return; editing = +b.dataset.p; J.sfx('pop'); renderQuien(); usarCategoria(cat); });
$('#estilos').addEventListener('click', async e => {
  const b = e.target.closest('[data-est]'); if (!b || b.dataset.est === estiloActual()) return;
  P.estilo = b.dataset.est; J.save(); J.sfx('pop'); renderEstilos();
  visibles.forEach(v => scene.remove(v.ch.group)); visibles.clear();
  await colocar(); fx.burst(new THREE.Vector3(0, 1.5, 0), 50, 1.5); J.sparkle();
});
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') { e.preventDefault(); mover(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); mover(1); }
  if (e.key === 'Enter' && document.activeElement === document.body) elegir();
  if (/^[0-9]$/.test(e.key) && !e.ctrlKey && !e.metaKey) { const k = Object.keys(EMOTES)[(+e.key + 9) % 10]; if (k) gesto(k); }
});
// con el dedo (o el ratón): arrastrar sobre el personaje del centro lo gira; un deslizón rápido, o deslizar a los lados, pasa al siguiente
const cv = $('#mundo'); let ini = null;
cv.addEventListener('pointerdown', e => {
  const fx2 = (e.clientX / innerWidth - .5) * 2;
  ini = { x: e.clientX, y: e.clientY, ux: e.clientX, t: performance.now(), ut: performance.now(), centro: Math.abs(fx2) < (narrow() ? .42 : .26) && visibles.has(0), yaw0: yaw };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!ini || !ini.centro) return;
  const ahora = performance.now(), d = (e.clientX - ini.ux) * .011, dt = Math.max(8, ahora - ini.ut) / 1000;
  if (Math.abs(e.clientX - ini.x) < 8 && !ini.gira) return;
  ini.gira = true; cv.classList.add('girando');
  yaw += d; yawV = Math.max(-9, Math.min(9, d / dt)); pausa = 3.5; ini.ux = e.clientX; ini.ut = ahora;
});
cv.addEventListener('pointerup', e => {
  if (!ini) return; const dx = e.clientX - ini.x, dy = e.clientY - ini.y, rapido = performance.now() - ini.t < 350, a = ini; ini = null;
  cv.classList.remove('girando');
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) && (!a.centro || rapido)) mover(dx < 0 ? 1 : -1);
  else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
    // ¿tocó a un vecino? se trae al centro
    const fx2 = (e.clientX / innerWidth - .5) * 2;
    if (Math.abs(fx2) > .32) mover(fx2 > 0 ? (fx2 > .7 && lista.length > 3 ? 2 : 1) : (fx2 < -.7 && lista.length > 3 ? -2 : -1));
    else { const v = visibles.get(0); if (v) { v.llego = 1.2; J.say(info(lista[idx]).name); } }
  }
});
cv.addEventListener('pointercancel', () => { ini = null; cv.classList.remove('girando'); });

// ---------- animación ----------
const tmp = new THREE.Vector3();
W.onFrame((dt, t) => {
  const k = Math.min(1, dt * 8);
  const centro = visibles.get(0);
  // la tornamesa: mira al frente mientras saluda o hace un gesto; si no, gira sola (o sigue el empujón del dedo)
  if (gestoT > 0) gestoT -= dt;
  const ocupado = gestoT > 0 || (centro && centro.llego > 0) || (regaloT > 0 && lista[idx] === regaloId);
  if (ini && ini.gira) { /* la lleva el dedo */ }
  else if (ocupado) { yaw += (Math.round(yaw / TAU) * TAU - yaw) * Math.min(1, dt * 6); yawV = 0; }
  else if (pausa > 0) { pausa -= dt; yaw += yawV * dt; yawV *= Math.exp(-dt * 3); }
  else { yawV += (.42 - yawV) * Math.min(1, dt * 1.5); yaw += yawV * dt; }
  plato.rotation.y = yaw;
  pedVecinos.forEach(p => { const q = posDe(p.o); p.m.position.set(q.x, .09, q.z); });
  for (const [o, v] of visibles) {
    const q = posDe(o), g = v.ch.group;
    tmp.set(q.x, o ? .18 : .28, q.z);
    g.position.lerp(tmp, k);
    const s = g.scale.x + ((o ? q.s * 1.05 : 1.25) - g.scale.x) * k; g.scale.setScalar(s);
    if (o) { if (g.rotation.y > Math.PI || g.rotation.y < -Math.PI) g.rotation.y = ((g.rotation.y + Math.PI) % TAU + TAU) % TAU - Math.PI; g.rotation.y += (-o * .35 - g.rotation.y) * k; }
    else g.rotation.y += (yaw - g.rotation.y) * Math.min(1, dt * 16);
    if (o === 0 && regaloT > 0 && lista[idx] === regaloId) { regaloT -= dt; v.ch.update(dt, regaloT > 6 ? 'festejar' : 'bailar'); }
    else if (o === 0 && v.llego > 0) { v.llego -= dt; v.ch.update(dt, v.llego > 1 ? 'festejar' : 'saludar'); }
    else v.ch.update(dt, 'quieto');
  }
  anillo.material.emissiveIntensity = .7 + Math.sin(t * 3) * .3;
  matFoco.emissiveIntensity = 1 + Math.sin(t * 5) * .4;
  brilloPiso.material.opacity = .82 + Math.sin(t * 1.7) * .12;
  for (let i = 0; i < rayos.length; i++) { const r = rayos[i]; r.material.opacity = r.userData.op * (.8 + Math.sin(t * 1.3 + i * 2) * .25); r.rotation.z = r.userData.inc + Math.sin(t * .5 + i) * .04; }
  fx.update(dt);
});

renderEstilos(); renderGestos(); renderQuien(); usarCategoria('todos', regaloId || undefined);
J.refreshMusic(); W.start();
if (regaloId) {
  // regalo de hoy: baila con confeti; si es un traje especial, se mira pero no se elige
  const b = document.createElement('div'); b.className = 'banner-regalo'; b.textContent = '🎁 Regalo de hoy'; document.body.appendChild(b);
  setTimeout(() => { J.confetti(140); J.cheer(true); fx.burst(new THREE.Vector3(0, 1.6, 0), 90, 1.6); J.say(['¡Regalo sorpresa!', info(regaloId).name], { queue: true }); }, 500);
  setTimeout(() => b.classList.add('fuera'), 9000);
} else setTimeout(() => J.say('¡Elige tu personaje!'), 400);
if (location.hash === '#prueba') window.__pj = { get idx() { return idx; }, get lista() { return lista; }, get yaw() { return yaw; }, mover, elegir, usarCategoria, gesto, visibles, cache, bloqueado, regaloId };
</script>
</body>
