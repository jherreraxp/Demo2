# Instala o actualiza el servidor en la VM de Oracle.
# Se ejecuta a mano (Actions → "Desplegar en la VM" → Run workflow) o al empujar cambios de servidor/ a la rama de trabajo.
# Necesita estos secretos del repositorio (Settings → Secrets and variables → Actions):
#   VM_HOST     IP pública de la VM (por ejemplo 146.181.18.35)
#   VM_USUARIO  usuario SSH (ubuntu)
#   VM_LLAVE    llave privada SSH que entra a la VM (una llave nueva, solo para este despliegue)
#   VM_DOMINIO  dominio del juego (abu.arcillita.com)
# Opcionales (se escriben en /etc/avelu/avelu.env de la VM; nunca quedan en el repositorio):
#   MP_ACCESS_TOKEN, MP_WEBHOOK_SECRET, MP_PLAN_PRECIO, PAYPAL_CLIENT_ID, PAYPAL_SECRET, PAYPAL_PLAN_ID, PAYPAL_MODE,
#   PAGOS_PROVEEDOR (mercadopago | paypal), PLAN_GRATIS_PARA,
#   IA_PROVEEDOR, IA_API_KEY, IA_MODELO, IA_BASE_URL (cuentos con IA de cualquier proveedor; ANTHROPIC_API_KEY sigue sirviendo), GOOGLE_CLIENT_ID
name: Desplegar en la VM
on:
  workflow_dispatch:
    inputs:
      accion:
        description: 'revisar = solo mira qué hay en la VM (no cambia nada); instalar = instala o actualiza'
        default: revisar
        type: choice
        options: [revisar, instalar]
concurrency: desplegar
jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Revisar secretos
        id: s
        env: { H: '${{ secrets.VM_HOST }}', K: '${{ secrets.VM_LLAVE }}', D: '${{ secrets.VM_DOMINIO }}' }
        run: |
          F=""; [ -z "$H" ] && F="$F VM_HOST"; [ -z "$K" ] && F="$F VM_LLAVE"; [ -z "$D" ] && F="$F VM_DOMINIO"
          if [ -n "$F" ]; then echo "::warning::Faltan estos secretos del repositorio:$F (Settings → Secrets and variables → Actions → pestaña Secrets → Repository secrets). No se despliega."; echo "listo=no" >> "$GITHUB_OUTPUT"; else echo "listo=si" >> "$GITHUB_OUTPUT"; fi
      - name: Preparar SSH
        if: steps.s.outputs.listo == 'si'
        env: { K: '${{ secrets.VM_LLAVE }}', H: '${{ secrets.VM_HOST }}' }
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$K" > ~/.ssh/vm && chmod 600 ~/.ssh/vm
          ssh-keyscan -T 15 "$H" >> ~/.ssh/known_hosts
      - name: Revisar la VM (solo lectura)
        if: steps.s.outputs.listo == 'si'
        env: { H: '${{ secrets.VM_HOST }}', U: '${{ secrets.VM_USUARIO }}' }
        run: |
          ssh -i ~/.ssh/vm -o BatchMode=yes "${U:-ubuntu}@$H" bash -s <<'REMOTO'
          echo "== Sistema"; . /etc/os-release; echo "$PRETTY_NAME $(uname -m)"; uptime
          echo "== Memoria y disco"; free -h | head -2; df -h / | tail -1
          echo "== Puertos escuchando"; sudo ss -ltnp | awk 'NR==1 || /LISTEN/'
          echo "== Servicios web"; for s in nginx apache2 httpd caddy traefik haproxy docker avelu; do systemctl is-active --quiet $s && echo "ACTIVO: $s"; done; true
          echo "== Docker"; command -v docker >/dev/null && sudo docker ps --format '{{.Names}}  {{.Image}}  {{.Ports}}' || echo "sin docker"
          echo "== Sitios nginx"; ls /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null; sudo grep -h "server_name\|listen" /etc/nginx/sites-enabled/* /etc/nginx/conf.d/*.conf 2>/dev/null | sort -u | head -40
          echo "== Caddy"; sudo cat /etc/caddy/Caddyfile 2>/dev/null | head -40
          echo "== Node"; command -v node && node --version || echo "sin node"
          echo "== Firewall"; sudo iptables -S INPUT 2>/dev/null | head -20; sudo ufw status 2>/dev/null | head -5
          echo "== Servicios systemd propios"; systemctl list-units --type=service --state=running --no-pager --no-legend | awk '{print $1}' | grep -vE '^(systemd|dbus|cron|ssh|snap|polkit|rsyslog|unattended|multipathd|networkd|udisks|ModemManager|getty|serial|irqbalance|chrony|oracle|iscsid|qemu|packagekit|accounts|user@)' | head -30
          REMOTO
      - name: Instalar o actualizar
        if: steps.s.outputs.listo == 'si' && (github.event_name == 'push' || inputs.accion == 'instalar')
        env: { H: '${{ secrets.VM_HOST }}', U: '${{ secrets.VM_USUARIO }}', D: '${{ secrets.VM_DOMINIO }}', R: '${{ github.ref_name }}' }
        run: |
          ssh -i ~/.ssh/vm -o BatchMode=yes "${U:-ubuntu}@$H" bash -s -- "$D" "$R" <<'REMOTO'
          set -euo pipefail
          D="$1"; R="$2"
          command -v git >/dev/null || sudo apt-get install -y git
          if [ ! -d ~/Demo2/.git ]; then git clone -b "$R" https://github.com/jherreraxp/Demo2.git ~/Demo2; fi
          cd ~/Demo2 && git fetch -q origin "$R" && git checkout -q "$R" && git reset -q --hard "origin/$R"
          sudo bash servidor/instalar.sh "$D"
          curl -fsS http://127.0.0.1:8787/api/salud && echo
          REMOTO
      - name: Configurar pagos e IA
        if: steps.s.outputs.listo == 'si' && (github.event_name == 'push' || inputs.accion == 'instalar')
        env:
          H: '${{ secrets.VM_HOST }}'
          U: '${{ secrets.VM_USUARIO }}'
          MP_ACCESS_TOKEN: '${{ secrets.MP_ACCESS_TOKEN }}'
          MP_WEBHOOK_SECRET: '${{ secrets.MP_WEBHOOK_SECRET }}'
          MP_PLAN_PRECIO: '${{ secrets.MP_PLAN_PRECIO }}'
          PAYPAL_CLIENT_ID: '${{ secrets.PAYPAL_CLIENT_ID }}'
          PAYPAL_SECRET: '${{ secrets.PAYPAL_SECRET }}'
          PAYPAL_PLAN_ID: '${{ secrets.PAYPAL_PLAN_ID }}'
          PAYPAL_MODE: '${{ secrets.PAYPAL_MODE }}'
          PAGOS_PROVEEDOR: '${{ secrets.PAGOS_PROVEEDOR }}'
          ANTHROPIC_API_KEY: '${{ secrets.ANTHROPIC_API_KEY }}'
          IA_PROVEEDOR: '${{ secrets.IA_PROVEEDOR }}'
          IA_API_KEY: '${{ secrets.IA_API_KEY }}'
          IA_MODELO: '${{ secrets.IA_MODELO }}'
          IA_BASE_URL: '${{ secrets.IA_BASE_URL }}'
          PLAN_GRATIS_PARA: '${{ secrets.PLAN_GRATIS_PARA }}'
          GOOGLE_CLIENT_ID: '${{ secrets.GOOGLE_CLIENT_ID }}'
        run: |
          {
            for k in MP_ACCESS_TOKEN MP_WEBHOOK_SECRET MP_PLAN_PRECIO PAYPAL_CLIENT_ID PAYPAL_SECRET PAYPAL_PLAN_ID PAYPAL_MODE ANTHROPIC_API_KEY IA_PROVEEDOR IA_API_KEY IA_MODELO IA_BASE_URL PLAN_GRATIS_PARA GOOGLE_CLIENT_ID; do printf '%s=%s\n' "$k" "${!k}"; done
            # si hay token de Mercado Pago y no se eligió proveedor, se usa Mercado Pago
            P="$PAGOS_PROVEEDOR"; [ -z "$P" ] && [ -n "$MP_ACCESS_TOKEN" ] && P=mercadopago; [ -z "$P" ] && [ -n "$PAYPAL_PLAN_ID" ] && P=paypal
            printf 'PAGOS_PROVEEDOR=%s\n' "$P"
          } | ssh -i ~/.ssh/vm -o BatchMode=yes "${U:-ubuntu}@$H" 'sudo install -m 600 /dev/stdin /etc/avelu/secretos.tmp && sudo bash ~/Demo2/servidor/configurar.sh && sleep 2 && curl -fsS http://127.0.0.1:8787/api/salud && echo'
      - name: Probar desde internet
        if: steps.s.outputs.listo == 'si' && (github.event_name == 'push' || inputs.accion == 'instalar')
        env: { D: '${{ secrets.VM_DOMINIO }}' }
        run: |
          for i in 1 2 3 4 5 6; do curl -fsS "https://$D/api/salud" && echo && curl -fsS -o /dev/null -w "Juego: %{http_code}\n" "https://$D/" && exit 0; sleep 20; done
          echo "::warning::El servidor funciona dentro de la VM, pero https://$D aún no responde desde internet. Revisa el DNS (registro A) y los puertos 80/443 en Oracle."
      - name: Limpiar
        if: always()
        run: rm -f ~/.ssh/vm
