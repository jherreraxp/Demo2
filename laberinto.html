<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="icon" href="assets/icono.svg" type="image/svg+xml">
<link rel="icon" href="assets/icono-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="assets/icono-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c9a2ff">
<title>Laberinto del Lobo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<link rel="stylesheet" href="css/juego3d.css">
<style>
body { background: linear-gradient(#bfe8ff, #f3fbff 60%); }
.joy { position: fixed; left: 18px; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); width: 132px; height: 132px; border-radius: 50%; background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 4px rgba(255,255,255,.8), 0 6px 0 var(--shadow); z-index: 6; touch-action: none; }
.joy .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: var(--paper); box-shadow: 0 4px 0 var(--shadow); display: grid; place-items: center; font-size: 26px; }
.jugador { display: flex; align-items: center; gap: 6px; }
.vidas { letter-spacing: 2px; }
.poder { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 146px); width: min(60vw, 320px); height: 14px; border-radius: 999px; background: rgba(35, 50, 74, .45); overflow: hidden; z-index: 5; }
.poder i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ffd23f, #ff7eb6); border-radius: 999px; }
.modos { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 4px 0 10px; }
.modos button { border-radius: 16px; padding: 8px 14px; font-size: 17px; font-weight: 800; background: #eef6fb; box-shadow: 0 4px 0 var(--shadow); }
.modos button.on { background: var(--gold); }
.modos small { display: block; font-size: 12px; font-weight: 600; opacity: .75; }
#nivel-desc { font-size: 17px; color: #5b6b82; min-height: 1.3em; }
@media (max-width: 600px) { .mision { top: calc(env(safe-area-inset-top, 0px) + 124px); } .poder { top: calc(env(safe-area-inset-top, 0px) + 196px); } }
@media (max-width: 420px) { .joy { width: 116px; height: 116px; } }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<script src="js/comun.js"></script>
<script src="js/tema.js"></script>
</head>
<body>
<canvas class="mundo" id="mundo" aria-label="Laberinto en 3D con el lobo"></canvas>

<div class="hud">
  <div class="hud-side">
    <a class="round-btn btn" href="index.html" aria-label="Volver al inicio">🏠</a>
    <div class="pill" aria-label="Nivel">Nivel <span id="nivel-num">1</span></div>
    <div class="pill vidas" id="vidas" aria-label="Vidas">❤️❤️❤️</div>
    <div class="pill" aria-label="Quesos que faltan">🧀 <span id="quesos">0</span></div>
  </div>
  <div class="hud-side">
    <button class="round-btn" data-musica aria-label="Música">🎵</button>
    <div class="pill jugador" id="jugador"></div>
  </div>
</div>

<div class="mision" id="mision" hidden>
  <span class="etq">Come el queso que dice</span>
  <span class="pic">🧀</span>
  <span class="word" id="m-word"></span>
  <button id="m-say" aria-label="Escuchar otra vez">🔊</button>
</div>
<div class="poder" id="poder" hidden><i id="poder-barra"></i></div>
<div id="mensaje" aria-live="polite"></div>

<div class="joy" id="joy" aria-label="Joystick para caminar"><div class="knob" id="knob">👣</div></div>

<div class="portada" id="portada">
  <div class="portada-caja">
    <div style="font-size:64px;line-height:1">🐺🧀⭐</div>
    <h1>Laberinto del Lobo</h1>
    <p>Come todos los <b>quesos</b> 🧀 sin que te atrape el lobo. Si comes una <b>estrella</b> ⭐, ¡el lobo se asusta y ahora tú lo haces correr!</p>
    <p style="font-size:16px">Camina con el joystick 👣, deslizando el dedo o con las flechas.</p>
    <div class="modos" id="modos" aria-label="Dificultad">
      <button data-m="peque">🐣 Peque<small>3–4 años</small></button>
      <button data-m="grande">🦊 Grande<small>5–6 años</small></button>
      <button data-m="experto">🦁 Experto<small>7+ años</small></button>
    </div>
    <div class="niveles" id="niveles" aria-label="Elige el nivel"></div>
    <div id="nivel-desc"></div>
    <button class="go" id="empezar" disabled>Cargando…</button>
    <a class="volver" href="personajes.html?volver=laberinto.html">Cambiar personaje</a>
  </div>
</div>

<script type="module" src="js/laberinto.js"></script>
</body>
</html>
