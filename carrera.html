<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Carrera de Palabras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<link rel="stylesheet" href="css/juego3d.css">
<style>
.flechas { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; justify-content: space-between; z-index: 5; pointer-events: none; }
.flecha { pointer-events: auto; width: 88px; height: 88px; border-radius: 28px; background: rgba(255,255,255,.88); font-size: 46px; box-shadow: 0 6px 0 var(--shadow); display: grid; place-items: center; }
.flecha:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--shadow); }
.ejemplo { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.ejemplo span { background: #eef6fb; border-radius: 999px; padding: 4px 12px; font-family: var(--font-letters); font-weight: 700; font-size: 20px; }
.ejemplo span.si { background: var(--go); color: #fff; }
.mochila { position: fixed; left: 12px; top: calc(env(safe-area-inset-top, 0px) + 140px); z-index: 5; background: rgba(255,255,255,.9); border-radius: 22px; padding: 6px 10px; font-size: 26px; box-shadow: 0 4px 0 var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.mochila span { font-size: 24px; animation: brinco .5s; }
@media (max-width: 600px) { .mochila { top: calc(env(safe-area-inset-top, 0px) + 175px); font-size: 20px; padding: 4px 6px; } .mochila span { font-size: 18px; } }
#nivel-desc { font-size: 17px; color: #5b6b82; min-height: 1.3em; }
@media (max-width: 420px) { .flecha { width: 76px; height: 76px; font-size: 40px; } }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<script src="js/comun.js"></script>
</head>
<body>
<canvas class="mundo" id="mundo" aria-label="Camino 3D con tu personaje corriendo"></canvas>

<div class="hud">
  <div class="hud-side">
    <a class="round-btn btn" href="index.html" aria-label="Volver al inicio">🏠</a>
    <div class="pill" aria-label="Nivel">Nivel <span id="nivel-num">1</span></div>
  </div>
  <div class="hud-side">
    <button class="round-btn" data-musica aria-label="Música">🎵</button>
    <div class="pill" id="jugador"></div>
  </div>
</div>

<div class="mision" id="mision" hidden>
  <span class="etq" id="m-etq">Atrapa</span>
  <span class="pic" id="m-pic"></span>
  <span class="word" id="m-word"></span>
  <button id="m-say" aria-label="Escuchar otra vez">🔊</button>
</div>
<div class="metas" id="metas" aria-label="Palabras para el regalo"></div>
<div class="mochila" id="mochila" aria-label="Mochila">🎒</div>
<div id="mensaje" aria-live="polite"></div>

<div class="flechas">
  <button class="flecha" id="izq" aria-label="Ir a la izquierda">⬅️</button>
  <button class="flecha" id="der" aria-label="Ir a la derecha">➡️</button>
</div>

<div class="portada" id="portada">
  <div class="portada-caja">
    <div style="font-size:64px;line-height:1">🏃‍♀️💬</div>
    <h1>Carrera de Palabras</h1>
    <p>Lee el letrero y atrapa al animalito correcto. ¡Guárdalo en tu mochila 🎒!</p>
    <div class="ejemplo" aria-hidden="true"><span>🐸 sapo</span><span class="si">🐱 gato</span><span>🍐 pera</span></div>
    <p style="font-size:16px">Usa las flechas ⬅️ ➡️ o desliza el dedo.</p>
    <div class="niveles" id="niveles" aria-label="Elige el nivel"></div>
    <div id="nivel-desc"></div>
    <button class="go" id="empezar" disabled>Cargando…</button>
    <a class="volver" href="personajes.html?volver=carrera.html">Cambiar personaje</a>
  </div>
</div>

<script type="module" src="js/carrera.js"></script>
</body>
</html>
