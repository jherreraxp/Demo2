<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Carrera de Palabras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: full-screen 3D road; HUD floats on top — target word centered, counters in the corners, big lane arrows at the bottom. */
:root {
  --sky-top: #7fd0f7;
  --sky-low: #dff3ff;
  --ink: #23324a;
  --paper: #ffffff;
  --gold: #f6c33b;
  --gold-dark: #c99a1c;
  --go: #4cb87a;
  --lane: #3f8ee8;
  --shadow: rgba(35, 50, 74, .3);
  --font-display: "Baloo 2", "Comic Sans MS", system-ui, sans-serif;
  --font-letters: "Andika", "Century Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: linear-gradient(var(--sky-top), var(--sky-low) 55%);
  color: var(--ink); font-family: var(--font-display);
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  touch-action: none;
}
canvas#mundo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }

.hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; z-index: 5; }
.hud > * { pointer-events: auto; }
.hud-side { display: flex; gap: 8px; align-items: center; }
.pill { background: rgba(35, 50, 74, .72); color: #fff; border-radius: 999px; padding: 4px 14px; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; display: flex; gap: 6px; align-items: center; }
.round-btn { width: 50px; height: 50px; border-radius: 50%; background: var(--paper); box-shadow: 0 4px 0 var(--shadow); font-size: 24px; display: grid; place-items: center; }
.round-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }

#target {
  position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 68px); z-index: 5;
  background: var(--paper); border-radius: 26px; box-shadow: 0 6px 0 var(--shadow);
  padding: 6px 10px 6px 16px; display: flex; align-items: center; gap: 10px; white-space: nowrap;
}
#target .busca { font-size: 18px; font-weight: 800; color: #6b7a90; text-transform: uppercase; letter-spacing: .06em; }
#target .pic { font-size: 46px; line-height: 1; }
#target .word { font-family: var(--font-letters); font-weight: 700; font-size: 40px; line-height: 1; }
#target button { background: #9a6ee0; color: #fff; border-radius: 50%; width: 48px; height: 48px; font-size: 22px; box-shadow: 0 4px 0 #6b47a8; }
#target.nuevo { animation: nuevo .5s ease-out; }
.metas { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 146px); display: flex; gap: 6px; z-index: 5; }
.meta { width: 22px; height: 22px; font-size: 18px; line-height: 22px; text-align: center; filter: grayscale(1) opacity(.45); }
.meta.on { filter: none; animation: nuevo .5s; }

.flechas { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; justify-content: space-between; z-index: 5; pointer-events: none; }
.flecha { pointer-events: auto; width: 88px; height: 88px; border-radius: 28px; background: rgba(255,255,255,.88); font-size: 46px; box-shadow: 0 6px 0 var(--shadow); display: grid; place-items: center; }
.flecha:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--shadow); }

#mensaje { position: fixed; left: 0; right: 0; top: 42%; text-align: center; font-size: clamp(36px, 10vw, 64px); font-weight: 800; color: #fff; text-shadow: 0 4px 0 rgba(35,50,74,.45), 0 0 20px rgba(35,50,74,.3); pointer-events: none; z-index: 6; opacity: 0; transition: opacity .2s; padding-inline: 16px; }
#mensaje.ver { opacity: 1; animation: nuevo .45s ease-out; }

.portada { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(35, 50, 74, .35); }
.portada-caja { background: var(--paper); border-radius: 32px; box-shadow: 0 10px 0 var(--shadow); padding: 22px 20px; max-width: 460px; width: 100%; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.portada h1 { margin: 0; font-size: clamp(34px, 9vw, 48px); line-height: 1; font-weight: 800; text-wrap: balance; }
.portada p { margin: 0; font-size: 20px; text-wrap: balance; }
.ejemplo { display: flex; gap: 8px; justify-content: center; }
.ejemplo span { background: #eef6fb; border-radius: 14px; padding: 4px 10px; font-family: var(--font-letters); font-weight: 700; font-size: 22px; }
.ejemplo span.si { background: var(--go); color: #fff; }
.go { background: var(--go); color: #fff; border-radius: 999px; padding: 12px 34px; font-size: 30px; font-weight: 800; box-shadow: 0 6px 0 #2f8a58; }
.go:disabled { background: #a9b4c2; box-shadow: 0 6px 0 #7d8897; cursor: wait; }
.go:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 #2f8a58; }
.volver { color: var(--ink); font-size: 18px; text-decoration: underline; background: none; }

@keyframes nuevo { from { transform: translateX(-50%) scale(.6); opacity: 0 } to { transform: translateX(-50%) scale(1); opacity: 1 } }
.meta.on, #mensaje.ver { animation-name: brinco; }
@keyframes brinco { from { transform: scale(.5); opacity: 0 } to { transform: scale(1); opacity: 1 } }
@media (max-width: 420px) {
  #target .pic { font-size: 38px; } #target .word { font-size: 32px; }
  .flecha { width: 76px; height: 76px; font-size: 40px; }
  .pill { font-size: 19px; padding: 3px 10px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<script src="js/comun.js"></script>
</head>
<body>
<canvas id="mundo" aria-label="Camino 3D con el zorrito corriendo"></canvas>

<div class="hud">
  <div class="hud-side">
    <a class="round-btn" href="index.html" aria-label="Volver al inicio" id="casa">🏠</a>
    <div class="pill" aria-label="Monedas">🪙 <span id="monedas">0</span></div>
  </div>
  <div class="hud-side">
    <button class="round-btn" data-musica aria-label="Música">🎵</button>
    <div class="pill" aria-label="Estrellas">⭐ <span id="estrellas">0</span></div>
  </div>
</div>

<div id="target" hidden>
  <span class="busca">Busca</span>
  <span class="pic" id="t-pic"></span>
  <span class="word" id="t-word"></span>
  <button id="t-say" aria-label="Escuchar otra vez">🔊</button>
</div>
<div class="metas" id="metas" aria-label="Palabras para el regalo"></div>
<div id="mensaje" aria-live="polite"></div>

<div class="flechas">
  <button class="flecha" id="izq" aria-label="Ir a la izquierda">⬅️</button>
  <button class="flecha" id="der" aria-label="Ir a la derecha">➡️</button>
</div>

<div class="portada" id="portada">
  <div class="portada-caja">
    <div style="font-size:72px;line-height:1">🦊</div>
    <h1>Carrera de Palabras</h1>
    <p>Escucha la palabra y corre por <b>su camino</b>.</p>
    <div class="ejemplo" aria-hidden="true"><span>🐸 sapo</span><span class="si">🐱 gato</span><span>🍐 pera</span></div>
    <p style="font-size:17px">Usa las flechas ⬅️ ➡️ o desliza el dedo.</p>
    <button class="go" id="empezar" disabled>Cargando…</button>
    <a class="volver" href="index.html">Volver</a>
  </div>
</div>

<script type="module" src="js/carrera.js"></script>
</body>
</html>
