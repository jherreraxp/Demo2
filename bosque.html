<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bosque de las Palabras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<link rel="stylesheet" href="css/juego3d.css">
<style>
body { background: linear-gradient(#9fdcf7, #e9f8ff 60%); }
.joy { position: fixed; left: 18px; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); width: 132px; height: 132px; border-radius: 50%; background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 4px rgba(255,255,255,.8), 0 6px 0 var(--shadow); z-index: 6; touch-action: none; }
.joy .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: var(--paper); box-shadow: 0 4px 0 var(--shadow); display: grid; place-items: center; font-size: 26px; }
.ayuda { position: fixed; right: 18px; bottom: calc(env(safe-area-inset-bottom, 0px) + 26px); z-index: 6; background: var(--paper); border-radius: 999px; padding: 10px 18px; font-size: 22px; font-weight: 800; box-shadow: 0 5px 0 var(--shadow); }
.ayuda:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--shadow); }
.jugador { display: flex; align-items: center; gap: 6px; }
.mochila { position: fixed; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 140px); z-index: 5; background: rgba(255,255,255,.9); border-radius: 22px; padding: 6px 10px; font-size: 28px; box-shadow: 0 4px 0 var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 2px; max-height: 55vh; overflow: hidden; }
.mochila span { font-size: 26px; animation: brinco .5s; }
@media (max-width: 600px) { .mochila { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 160px); font-size: 22px; } .mochila span { font-size: 20px; } }
@media (max-width: 420px) { .joy { width: 116px; height: 116px; } .ayuda { font-size: 19px; padding: 8px 14px; } }
#nivel-desc { font-size: 17px; color: #5b6b82; min-height: 1.3em; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<script src="js/comun.js"></script>
<script src="js/tema.js"></script>
</head>
<body>
<canvas class="mundo" id="mundo" aria-label="Bosque laberinto en 3D"></canvas>

<div class="hud">
  <div class="hud-side">
    <a class="round-btn btn" href="index.html" aria-label="Volver al inicio">🏠</a>
    <div class="pill" aria-label="Estrellitas encontradas">✨ <span id="brillos">0</span></div>
  </div>
  <div class="hud-side">
    <button class="round-btn" data-musica aria-label="Música">🎵</button>
    <div class="pill jugador" id="jugador"></div>
  </div>
</div>
<div class="mochila" id="mochila" aria-label="Mochila con lo que encontraste">🎒</div>

<div class="mision" id="mision" hidden>
  <span class="etq" id="m-etq">Busca</span>
  <span class="pic" id="m-pic"></span>
  <span class="word" id="m-word"></span>
  <button id="m-say" aria-label="Escuchar la misión">🔊</button>
</div>
<div class="metas" id="metas"></div>
<div id="mensaje" aria-live="polite"></div>

<div class="joy" id="joy" aria-label="Joystick para caminar"><div class="knob" id="knob">👣</div></div>
<button class="ayuda" id="ayuda">🧚 ¿Dónde está?</button>

<div class="portada" id="portada">
  <div class="portada-caja">
    <div style="font-size:64px;line-height:1">🎁📖🐱</div>
    <h1>Bosque de las Palabras</h1>
    <p>Busca la <b>cajita</b> del color que te digo, <b>lee</b> lo que dice y atrapa al animalito que está cerquita. ¡Guárdalo en tu mochila 🎒!</p>
    <p style="font-size:16px">Camina con el joystick 👣, con las flechas o tocando el camino.</p>
    <div class="niveles" id="niveles" aria-label="Elige el nivel"></div>
    <div id="nivel-desc"></div>
    <button class="go" id="empezar" disabled>Cargando…</button>
    <a class="volver" href="personajes.html?volver=bosque.html">Cambiar personaje</a>
  </div>
</div>

<script type="module" src="js/bosque.js"></script>
</body>
</html>
