<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudio Mágico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">

<style>
/* Layout: a magic workshop — choose what to invent, a giant mic, the heard words as big tappable chips, then the result card. */
html { background: var(--tema-bg2, #c9b6ff); }
body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 0%, #fff4fb, var(--tema-bg1, #ffd6ec) 45%, var(--tema-bg2, #c9b6ff)) fixed; color: var(--tema-tinta, #23324a); font-family: "Baloo 2", system-ui, sans-serif; }
main { box-sizing: border-box; max-width: 900px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 40px; display: flex; flex-direction: column; gap: 14px; }
.barra { display: flex; align-items: center; gap: 10px; }
.barra h1 { flex: 1; margin: 0; font-size: clamp(26px, 6vw, 38px); line-height: 1.05; }
.papas { border: 0; border-radius: 999px; background: rgba(255,255,255,.85); padding: 8px 14px; font: 800 16px "Baloo 2", system-ui; box-shadow: 0 4px 0 rgba(90,60,140,.2); cursor: pointer; color: inherit; }
.tipos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tipo { border: 4px solid transparent; border-radius: 26px; background: rgba(255,255,255,.88); padding: 14px 10px; font: 800 clamp(20px, 4.6vw, 28px)/1.1 "Baloo 2", system-ui; color: inherit; box-shadow: 0 6px 0 rgba(90,60,140,.22); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.tipo span { font-size: clamp(48px, 12vw, 72px); line-height: 1; }
.tipo.on { border-color: #ff5dab; background: #fff; transform: translateY(-3px); }
.mic-zona { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.mic { width: clamp(130px, 34vw, 180px); aspect-ratio: 1; border-radius: 50%; border: 0; font-size: clamp(64px, 17vw, 92px); background: linear-gradient(145deg, #ff7eb6, #9a6ee0); box-shadow: 0 10px 0 #6b47a8, 0 0 0 0 rgba(255,93,171,.5); cursor: pointer; transition: transform .1s; }
.mic:active { transform: translateY(4px); box-shadow: 0 6px 0 #6b47a8; }
.mic.oye { animation: pulso 1.1s infinite; }
@keyframes pulso { 0% { box-shadow: 0 10px 0 #6b47a8, 0 0 0 0 rgba(255,93,171,.55); } 100% { box-shadow: 0 10px 0 #6b47a8, 0 0 0 36px rgba(255,93,171,0); } }
.pista { font-size: 19px; font-weight: 700; text-align: center; opacity: .85; }
.dicho { min-height: 64px; background: #fff; border-radius: 22px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; box-shadow: 0 5px 0 rgba(90,60,140,.18); }
.dicho:empty::before { content: 'Aquí aparecen tus palabras ✨'; color: #8a93a6; font-size: 18px; }
.pal { border: 0; border-radius: 14px; background: #f3ebff; padding: 2px 12px; font: 700 clamp(26px, 6.5vw, 38px)/1.25 Andika, "Century Gothic", sans-serif; color: #3b2a7a; cursor: pointer; }
.pal:nth-child(3n+2) { background: #ffe6f3; color: #a0225f; } .pal:nth-child(3n) { background: #e3f7ff; color: #135d7c; }
.escribir { display: flex; gap: 8px; }
.escribir textarea { flex: 1; font: 700 20px/1.3 Andika, sans-serif; border: 2px solid #e2d6fb; border-radius: 16px; padding: 10px; resize: vertical; min-height: 60px; color: inherit; }
.crear { border: 0; border-radius: 999px; background: linear-gradient(135deg, #ffd23f, #ff8a3d); color: #3b2300; font: 800 clamp(24px, 6vw, 32px) "Baloo 2", system-ui; padding: 10px 34px; box-shadow: 0 7px 0 #c0601f; cursor: pointer; align-self: center; }
.crear:disabled { filter: grayscale(.7); opacity: .6; cursor: default; }
.pensando { text-align: center; font-size: 28px; font-weight: 800; }
.pensando i { display: inline-block; font-style: normal; animation: brilla 1s infinite alternate; }
.pensando i:nth-child(2) { animation-delay: .2s; } .pensando i:nth-child(3) { animation-delay: .4s; }
@keyframes brilla { from { transform: translateY(0) scale(1); opacity: .5; } to { transform: translateY(-10px) scale(1.25); opacity: 1; } }
.resultado { background: #fff; border-radius: 28px; padding: 14px; box-shadow: 0 7px 0 rgba(90,60,140,.22); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 14px; align-items: center; }
.resultado canvas { width: 100%; aspect-ratio: 1; border-radius: 20px; background: linear-gradient(#fff4fb, #e8dcff); display: block; }
.resultado .grande { font-size: clamp(64px, 16vw, 110px); line-height: 1; text-align: center; }
.resultado h2 { margin: 0; font-size: clamp(30px, 7vw, 46px); line-height: 1.05; }
.resultado .frase { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.resultado .botones { display: flex; flex-wrap: wrap; gap: 8px; }
.btn2 { border: 0; border-radius: 18px; padding: 10px 16px; font: 800 19px "Baloo 2", system-ui; background: #9a6ee0; color: #fff; box-shadow: 0 5px 0 #6b47a8; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn2.claro { background: #fff; color: #3b2a7a; box-shadow: 0 5px 0 #d9ccf5; border: 2px solid #e2d6fb; }
.btn2.peligro { background: #fff; color: #c0392b; box-shadow: 0 5px 0 #f1c9c4; border: 2px solid #f1c9c4; }
.error { background: #fff1f0; color: #a3261b; border-radius: 18px; padding: 12px 14px; font-size: 19px; font-weight: 700; text-align: center; }
.sin-magia { background: #fff; border-radius: 24px; padding: 18px; text-align: center; font-size: 21px; font-weight: 700; box-shadow: 0 6px 0 rgba(90,60,140,.2); }
.panel { background: rgba(255,255,255,.92); border-radius: 22px; padding: 14px; box-shadow: 0 5px 0 rgba(90,60,140,.15); font-family: system-ui, sans-serif; }
.panel h2 { font: 800 22px "Baloo 2", system-ui; margin: 0 0 6px; }
.panel .fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid #eee6fb; }
.panel .fila:first-of-type { border-top: 0; }
.panel .fila b { flex: 1; min-width: 140px; font-size: 17px; }
.panel small { color: #5b6b82; }
.panel select { font: inherit; padding: 6px 8px; border-radius: 10px; border: 1px solid #e2d6fb; }
.panel button { font: 700 15px system-ui; border-radius: 10px; border: 1px solid #e2d6fb; background: #fff; padding: 6px 10px; cursor: pointer; color: #23324a; }
.jugar { position: fixed; inset: 0; z-index: 60; background: rgba(35,25,70,.7); display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px calc(env(safe-area-inset-bottom, 0px) + 10px); gap: 8px; }
.jugar .tope { display: flex; align-items: center; gap: 10px; color: #fff; font: 800 24px "Baloo 2", system-ui; }
.jugar .tope .round-btn { color: #23324a; }
.jugar .tope span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jugar .marco { flex: 1; border-radius: 20px; overflow: hidden; background: #fff; }
[hidden] { display: none !important; }
@media (max-width: 600px) { .resultado { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .mic.oye, .pensando i { animation: none; } }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }

<body>
<main>
  <div class="barra">
    <a class="round-btn btn" href="index.html" aria-label="Volver al inicio">🏠</a>
    <h1>🪄 Estudio Mágico</h1>
    <button class="round-btn" data-musica aria-label="Música">🎵</button>
    <button class="papas" id="papas">🔒 Papás</button>
  </div>

  <div class="sin-magia" id="sin-magia" hidden>✨ La magia está dormida.<br>Pídele a papá o mamá que la active en el admin.<br><br><button class="btn2" id="ir-admin">🔒 Ir al admin</button></div>

  <div class="tipos" role="radiogroup" aria-label="¿Qué quieres crear?">
    <button class="tipo on" data-tipo="personaje" role="radio" aria-checked="true"><span>🧒</span>Un personaje</button>
    <button class="tipo" data-tipo="juego" role="radio" aria-checked="false"><span>🎮</span>Un jueguito</button>
  </div>

  <div class="mic-zona">
    <button class="mic" id="mic" aria-label="Toca y dime qué quieres crear">🎤</button>
    <div class="pista" id="pista">Toca el micrófono y dime cómo es.</div>
  </div>
  <div class="dicho" id="dicho" aria-live="polite"></div>
  <div class="escribir" id="escribir" hidden>
    <textarea id="texto" placeholder="Escribe aquí: una princesa con pelo morado y botas…" aria-label="Lo que quieres crear"></textarea>
  </div>
  <button class="crear" id="crear" disabled>✨ ¡Crear!</button>
  <div class="pensando" id="pensando" hidden>Pensando <i>✨</i><i>🪄</i><i>✨</i></div>
  <div class="error" id="error" hidden></div>
  <div id="resultado"></div>

  <div class="panel" id="panel" hidden>
    <h2>🔧 Para mamá y papá</h2>
    <div class="fila"><b>Usar la IA de</b><select id="prov"><option value="claude">Claude</option><option value="gemini">Gemini</option></select><small id="quedan"></small></div>
    <div class="fila"><b>Llaves y modelos</b><a class="btn2 claro" href="admin.html#ia">⚙️ Configurar en el admin</a></div>
    <h2 style="margin-top:10px">🎮 Jueguitos mágicos</h2>
    <div id="lista-juegos"></div>
    <h2 style="margin-top:10px">🧒 Personajes inventados</h2>
    <div id="lista-pj"></div>
  </div>
</main>
<div class="jugar" id="jugar" hidden>
  <div class="tope"><button class="round-btn" id="cerrar-juego" aria-label="Cerrar">✕</button><span id="jugar-tit"></span></div>
  <div class="marco" id="jugar-marco"></div>
</div>

<script type="module">
import * as THREE from 'three';
import * as PJ from './js/personajes.js';
const J = window.Juego, P = J.progress, $ = s => document.querySelector(s);
const TEST = location.hash === '#prueba';
let tipo = 'personaje', texto = '', escucha = null, papas = false;

// ---------- pantalla ----------
function revisarMagia() {
  const hay = IA.hayMagia();
  $('#sin-magia').hidden = hay;
  $('#crear').disabled = !hay || !texto.trim();
  $('#escribir').hidden = IA.puedeDictar && !papas;
  if (!IA.puedeDictar) $('#pista').textContent = 'Escribe lo que quieres crear.';
  $('#mic').hidden = !IA.puedeDictar;
}
function mostrarDicho(t) {
  texto = t;
  // cada palabra en grande, para leerla y tocarla
  $('#dicho').innerHTML = t.trim() ? t.trim().split(/\s+/).map(w => `<button class="pal">${J.esc(w)}</button>`).join('') : '';
  revisarMagia();
}
$('#dicho').addEventListener('click', e => { const b = e.target.closest('.pal'); if (b) J.say(b.textContent.replace(/[^\p{L}\p{N}\s]/gu, '')); });
$('#texto').addEventListener('input', e => mostrarDicho(e.target.value));
document.querySelector('.tipos').addEventListener('click', e => {
  const b = e.target.closest('[data-tipo]'); if (!b) return;
  tipo = b.dataset.tipo;
  document.querySelectorAll('.tipo').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', x === b); });
  J.sfx('pop'); J.say(tipo === 'juego' ? 'Un jueguito' : 'Un personaje');
  $('#texto').placeholder = tipo === 'juego' ? 'Escribe aquí: un juego de atrapar estrellas con letras…' : 'Escribe aquí: una princesa con pelo morado y botas…';
});
$('#mic').onclick = () => {
  if (escucha) { escucha.parar(); return; }
  $('#error').hidden = true;
  $('#mic').classList.add('oye'); $('#pista').textContent = 'Te escucho… 👂';
  J.say('Te escucho');
  setTimeout(() => {
    escucha = IA.escuchar({
      onParcial: t => mostrarDicho(t),
      onFin: t => { escucha = null; $('#mic').classList.remove('oye'); $('#pista').textContent = t ? '¿Así está bien? Toca ✨ ¡Crear!' : 'Toca el micrófono y dime cómo es.'; if (t) mostrarDicho(t); },
      onError: er => { escucha = null; $('#mic').classList.remove('oye'); mostrarError(er.message); $('#escribir').hidden = false; },
    });
  }, 700);
};
function mostrarError(m) { const el = $('#error'); el.textContent = '😅 ' + m; el.hidden = false; }
$('#ir-admin').onclick = () => J.pedirPin(() => { location.href = 'admin.html#ia'; });

// ---------- crear ----------
$('#crear').onclick = async () => {
  if (!texto.trim()) return;
  $('#crear').disabled = true; $('#error').hidden = true; $('#resultado').innerHTML = ''; $('#pensando').hidden = false;
  J.say('Pensando…'); J.sparkle && J.sparkle();
  try {
    if (tipo === 'juego') await crearJuego(texto.trim()); else await crearPersonajeIA(texto.trim());
  } catch (er) { mostrarError(er.message || 'Algo salió mal.'); J.efecto('error'); }
  $('#pensando').hidden = true; revisarMagia(); pintarPanel();
};

// --- personaje ---
const uniq = a => [...new Set(a.filter(Boolean))];
function esquema() {
  if (PJ.ESQUEMA) {
    const E = PJ.ESQUEMA;
    if (typeof E === 'string') return E;
    const ej = { ...(E.ejemplo || {}), frase: 'Luna canta y tiene botas.' };
    return `Qué se puede poner (esquema): ${JSON.stringify({ descripcion: E.descripcion, personaje: E.personaje, fig: E.fig })}\nResponde con un JSON como este ejemplo (solo cambia lo que haga falta; "fig" solo lleva lo que cambia de la base) y agrega "frase": una frase MUY corta y fácil de leer que describa al personaje:\n${JSON.stringify(ej)}`;
  }
  const F = PJ.FIGURAS || {}, ids = Object.keys(F);
  const partes = uniq(ids.flatMap(k => Object.keys(F[k].c || {})));
  return JSON.stringify({
    nombre: 'nombre corto en español',
    emoji: 'un emoji',
    base: `uno de: ${(PJ.PERSONAJES || ids).join(', ')} (el más parecido; personas: ${ids.join(', ')})`,
    estilo: `uno de: ${Object.keys(PJ.ESTILOS || { bloques: 1 }).join(', ')} (opcional)`,
    fig: {
      piel: '#rrggbb', ojos: '#rrggbb',
      pelo: { e: `uno de: ${uniq(ids.map(k => F[k].pelo?.e)).join(', ')}`, c: '#rrggbb', larga: 'true/false' },
      ropa: `uno de: ${uniq(ids.map(k => F[k].ropa)).join(', ')}`,
      corona: 'hielo | oro | estrella (opcional)', gorra: 'true/false', audifonos: 'true/false', aretes: 'true/false', capa: '#rrggbb (opcional)',
      logo: 'estrella | rayo | corazon | flor (opcional)',
      c: Object.fromEntries(partes.map(p => [p, '#rrggbb'])),
    },
    frase: 'una frase MUY corta y fácil de leer que describa al personaje, por ejemplo: "Luna tiene pelo morado."',
  }, null, 1);
}
function normalizar(spec) {
  const F = PJ.FIGURAS || {}, todos = PJ.PERSONAJES || Object.keys(F);
  const base = todos.includes(spec.base) ? spec.base : 'amara';
  const fig = { ...(spec.fig || {}) };
  if (fig.c) fig.c = IA.limpiarColores(fig.c);
  ['piel', 'ojos', 'capa'].forEach(k => { if (fig[k] !== undefined) { const n = IA.hexNum(fig[k]); if (n === null) delete fig[k]; else fig[k] = n; } });
  if (fig.pelo) { const n = IA.hexNum(fig.pelo.c); fig.pelo = { ...(F[base]?.pelo || {}), ...fig.pelo }; if (n !== null) fig.pelo.c = n; else delete fig.pelo.c; if (spec.fig.pelo.larga !== undefined) fig.pelo.larga = spec.fig.pelo.larga === true || spec.fig.pelo.larga === 'true'; }
  Object.keys(fig).forEach(k => { if (fig[k] === 'true' || fig[k] === 'false') fig[k] = fig[k] === 'true'; });
  const nombre = String(spec.nombre || 'Personaje mágico').slice(0, 24);
  const base_id = 'c_' + IA.slug(nombre).replace(/-/g, '_');
  let id = base_id, k = 2;
  const custom = P.personajesCustom || {};
  while ((custom[id] && custom[id].nombre !== nombre) || (F[id] && !custom[id])) id = base_id + '_' + k++;
  const estilo = PJ.ESTILOS && PJ.ESTILOS[spec.estilo] ? spec.estilo : undefined;
  return { id, nombre, emoji: [...String(spec.emoji || '✨')].slice(0, 2).join(''), base, estilo, fig, frase: String(spec.frase || '').slice(0, 120) };
}
async function crearPersonajeIA(pedido) {
  const sistema = `Eres un diseñador de personajes para un juego infantil en español (Perú) donde una niña de 4 años aprende a leer. ` +
    `Inventa un personaje lindo y original (nunca copies personajes de películas, marcas ni famosos) a partir de lo que pide la niña. ` +
    `Responde SOLO con un objeto JSON válido, sin texto extra, con esta forma:\n${esquema()}\nUsa colores alegres en formato "#rrggbb". La frase debe tener palabras simples de 2 sílabas cuando se pueda.`;
  const t = await IA.llamar({ sistema, mensaje: `La niña pidió: "${pedido}"`, json: true });
  const spec = normalizar(IA.sacarJSON(t));
  const guardar = { nombre: spec.nombre, emoji: spec.emoji, base: spec.base, estilo: spec.estilo, fig: spec.fig };
  if (typeof PJ.registrarPersonaje === 'function') spec.id = PJ.registrarPersonaje(spec.id, guardar) || spec.id;
  else { P.personajesCustom = P.personajesCustom || {}; P.personajesCustom[spec.id] = guardar; J.save(); }
  J.CHARS[spec.id] = { name: spec.nombre, emoji: spec.emoji };
  await mostrarPersonaje(spec);
  J.cheer(true); J.say(['¡Listo!', spec.nombre]);
  if (spec.frase) setTimeout(() => J.say(spec.frase, { queue: true }), 300);
}
// vista 3D que gira
let vista = null;
async function figuraDe(spec) {
  const conoce = (PJ.PERSONAJES || []).includes(spec.id) || (PJ.FIGURAS || {})[spec.id];
  if (conoce) return PJ.crearPersonaje(spec.id, '', { estilo: spec.estilo });
  // si el módulo 3D todavía no sabe de personajes inventados: la base pintada con sus colores
  const ch = await PJ.crearPersonaje(spec.base, '', { colores: false, estilo: spec.estilo });
  Object.entries(spec.fig.c || {}).forEach(([parte, c]) => PJ.pintarParte(ch, parte, c));
  if (spec.fig.pelo?.c !== undefined) PJ.pintarParte(ch, 'pelo', spec.fig.pelo.c);
  if (spec.fig.piel !== undefined) PJ.pintarParte(ch, 'piel', spec.fig.piel);
  return ch;
}
async function mostrarPersonaje(spec) {
  const r = $('#resultado');
  const frase = (spec.frase || `${spec.nombre} es mágico.`).split(/\s+/).map(w => `<button class="pal">${J.esc(w)}</button>`).join('');
  r.innerHTML = `<div class="resultado"><canvas id="vista3d" aria-label="${J.esc(spec.nombre)} en 3D"></canvas><div>
    <h2>${J.esc(spec.emoji)} ${J.esc(spec.nombre)}</h2><div class="frase">${frase}</div>
    <div class="botones"><button class="btn2" id="elegir">⭐ ¡Es mi personaje!</button><a class="btn2 claro" href="personajes.html">👀 Ver con los demás</a></div></div></div>`;
  r.querySelector('.frase').addEventListener('click', e => { const b = e.target.closest('.pal'); if (b) J.say(b.textContent.replace(/[^\p{L}\p{N}\s]/gu, '')); });
  $('#elegir').onclick = () => { J.player().char = spec.id; J.save(); J.cheer(); J.say(['¡Hola!', spec.nombre]); $('#elegir').textContent = '✔ ¡Elegido!'; };
  if (vista) vista.parar();
  const canvas = $('#vista3d');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const w = canvas.clientWidth || 300; renderer.setSize(w, w, false);
  const sc = new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xffffff, 0xe6d4ff, 2.2));
  const d = new THREE.DirectionalLight(0xffffff, 1.6); d.position.set(2, 4, 5); sc.add(d);
  const cam = new THREE.PerspectiveCamera(30, 1, .1, 50); cam.position.set(0, 1.25, 5.4); cam.lookAt(0, .9, 0);
  const ch = await figuraDe(spec); ch.group.position.y = -.2; sc.add(ch.group);
  let on = true, t0 = performance.now(), last = t0;
  (function loop(now = performance.now()) {
    if (!on) return;
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    ch.update(dt, now - t0 < 1600 ? 'festejar' : 'bailar');
    ch.group.rotation.y += dt * .5;
    renderer.render(sc, cam); requestAnimationFrame(loop);
  })();
  vista = { parar() { on = false; renderer.dispose(); } };
}

// --- jueguito ---
async function crearJuego(pedido) {
  const palabras = (J.palabras ? J.palabras('lectura') : []).map(w => w[0]).slice(0, 24).join(', ');
  const sistema = `Eres un creador de jueguitos educativos para una niña de 4 años (${J.esc(J.childName())}) en Perú que aprende a leer con el método fonético-silábico.
Crea UN solo archivo HTML completo que funcione solo, sin internet:
- Todo el CSS y JavaScript dentro del archivo. PROHIBIDO cargar nada de afuera (sin CDNs, sin fetch, sin imágenes de internet, sin fuentes externas). Usa emojis, CSS, canvas o SVG para los dibujos.
- Todo en español. Botones y objetivos GRANDES (mínimo 90 px), fáciles de tocar en tablet y celular, que se vea bien vertical y horizontal.

  const t = await IA.llamar({ sistema, mensaje: `La niña pidió: "${pedido}"` });
  const g = IA.leerJuego(t);
  const id = IA.slug(g.titulo) + '-' + Date.now().toString(36).slice(-4);

function mostrarJuego(j) {
  const titulo = j.titulo.split(/\s+/).map(w => `<button class="pal">${J.esc(w)}</button>`).join('');
  $('#resultado').innerHTML = `<div class="resultado"><div class="grande">${J.esc(j.emoji)}</div><div>
    <div class="frase">${titulo}</div>
    <div class="botones"><button class="btn2" data-jugar="${j.id}">▶ ¡A jugar!</button><a class="btn2 claro" href="index.html">🏠 Está en el menú (✨ Mágicos)</a></div></div></div>`;
  $('#resultado .frase').addEventListener('click', e => { const b = e.target.closest('.pal'); if (b) J.say(b.textContent); });
}
function jugar(id) {
  const j = IA.juegoLocal(id); if (!j) return;
  $('#jugar-tit').textContent = `${j.emoji} ${j.titulo}`; $('#jugar').hidden = false;
  J.stopMusic && J.stopMusic();
  IA.montarJuego($('#jugar-marco'), j.html, j.titulo);
}
document.addEventListener('click', e => { const b = e.target.closest('[data-jugar]'); if (b) jugar(b.dataset.jugar); });
$('#cerrar-juego').onclick = () => { $('#jugar').hidden = true; $('#jugar-marco').innerHTML = ''; };

// ---------- modo papás ----------
function pintarPanel() {
  if (!papas) return;
  const c = IA.config(), q = IA.quedan();
  $('#prov').value = IA.proveedor() || c.proveedor;
  [...$('#prov').options].forEach(o => { o.disabled = !(o.value === 'claude' ? c.claude : c.gemini); o.textContent = (o.value === 'claude' ? 'Claude' : 'Gemini') + (o.disabled ? ' (sin llave)' : ''); });
  $('#quedan').textContent = q === Infinity ? 'sin límite diario' : `quedan ${q} creaciones hoy`;
  const lj = IA.juegosLocales();
  $('#lista-juegos').innerHTML = lj.length ? lj.map(j => `<div class="fila"><b>${J.esc(j.emoji)} ${J.esc(j.titulo)}<br><small>${J.esc(j.pedido || '')} · ${new Date(j.fecha).toLocaleDateString('es-PE')}${j.publicado ? ' · 🌐 publicado' : ''}</small></b>
      <button data-jugar="${j.id}">▶ Jugar</button><button data-pub="${j.id}">🌐 Publicar en la web</button><button data-borrar="${j.id}">🗑️ Borrar</button></div>`).join('') : '<small>Todavía no hay jueguitos.</small>';
  const pj = Object.entries(P.personajesCustom || {});
  $('#lista-pj').innerHTML = pj.length ? pj.map(([id, c]) => `<div class="fila"><b>${J.esc(c.emoji || '⭐')} ${J.esc(c.nombre || id)}</b><button data-borrar-pj="${id}">🗑️ Borrar</button></div>`).join('') : '<small>Todavía no hay personajes inventados.</small>';
}
$('#prov').onchange = e => { IA.LS.set('bl-ia-proveedor', e.target.value); pintarPanel(); };
let armado = null;
$('#panel').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.borrar || b.dataset.borrarPj) {
    const k = b.dataset.borrar || b.dataset.borrarPj;
    if (armado !== k) { armado = k; b.textContent = '¿Seguro? Toca otra vez'; setTimeout(() => { if (armado === k) { armado = null; pintarPanel(); } }, 3000); return; }
    armado = null;
    if (b.dataset.borrar) IA.borrarJuego(k);
    else if (typeof PJ.borrarPersonaje === 'function' && PJ.borrarPersonaje(k)) {}
    else { delete P.personajesCustom[k]; delete J.CHARS[k]; P.players.forEach(p => { if (p.char === k) p.char = 'nieve'; }); J.save(); }
    pintarPanel(); return;
  }
  if (b.dataset.pub) {
    const id = b.dataset.pub; b.disabled = true;
    try { await IA.publicarJuego(id, t => { b.textContent = t; }); b.textContent = '✔ Publicado (en 1–2 minutos)'; }
    catch (er) { b.textContent = '🌐 Publicar en la web'; mostrarError(er.message); }
    b.disabled = false;
  }
});
$('#papas').onclick = () => {
  if (papas) { papas = false; $('#panel').hidden = true; $('#papas').textContent = '🔒 Papás'; revisarMagia(); return; }
  J.pedirPin(() => { papas = true; $('#panel').hidden = false; $('#papas').textContent = '🔓 Salir'; revisarMagia(); pintarPanel(); $('#panel').scrollIntoView({ behavior: 'smooth' }); });
};

revisarMagia();
setTimeout(() => J.say(IA.hayMagia() ? ['¿Qué quieres crear?', 'Toca el micrófono y dime cómo es.'] : 'Pídele a papá o mamá que active la magia.'), 700);
if (TEST) window.__ia = { mostrarDicho, crear: () => $('#crear').click(), set tipo(v) { document.querySelector(`[data-tipo="${v}"]`).click(); }, papas: () => { papas = true; $('#panel').hidden = false; revisarMagia(); pintarPanel(); }, jugar };
