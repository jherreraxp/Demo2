<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="icon" href="assets/icono.svg" type="image/svg+xml">
<link rel="icon" href="assets/icono-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="assets/icono-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c9a2ff">
<title>En Raya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<link rel="stylesheet" href="css/juego3d.css">
<style>
/* Layout: barra arriba (inicio, marcador, música, jugador), turno al centro, tablero cuadrado que se ajusta a la pantalla. */
body { background: radial-gradient(circle at 50% 20%, #fff6fb, #ffd9ef 50%, #cdbaff); min-height: 100vh; }
[hidden] { display: none !important; }
.vez { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 70px); z-index: 4; display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 999px; padding: 6px 18px 6px 8px; box-shadow: 0 5px 0 rgba(35,50,74,.15); font: 800 clamp(16px, 3.6vw, 22px) var(--font-display); color: #23324a; white-space: nowrap; }
.vez .ficha { width: 44px; height: 44px; font-size: 22px; }
.zona { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 128px); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: grid; place-items: center; padding: 0 10px; }
.tablero { display: grid; gap: var(--gap, 8px); padding: var(--gap, 8px); background: rgba(255,255,255,.55); border-radius: 22px; box-shadow: 0 8px 0 rgba(90,60,140,.18); touch-action: manipulation; }
.tablero.gravedad { background: linear-gradient(#7fb2ff, #5b8cff); }
.casilla { width: var(--t, 80px); height: var(--t, 80px); border-radius: 18px; background: #fff; display: grid; place-items: center; padding: 0; box-shadow: inset 0 -5px 0 rgba(35,50,74,.08); cursor: pointer; }
.tablero.gravedad .casilla { border-radius: 50%; background: #e9f1ff; box-shadow: inset 0 4px 0 rgba(35,50,74,.18); }
.casilla:focus-visible { outline: 4px solid #9a6ee0; outline-offset: 2px; }
.ficha { width: 86%; height: 86%; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-letters, Andika, sans-serif); font-weight: 700; color: #23324a; line-height: 1; animation: cae .35s cubic-bezier(.3, 1.5, .5, 1); box-shadow: 0 4px 0 rgba(0,0,0,.15); }
.ficha.j0 { background: radial-gradient(circle at 35% 30%, #fff3b0, #ffc93c); }
.ficha.j1 { background: radial-gradient(circle at 35% 30%, #ffd6f0, #ff7eb6); }
.ficha.gana { animation: brilla .7s ease-in-out infinite alternate; box-shadow: 0 0 0 5px #fff, 0 0 18px 6px #ffd23f; }
@keyframes cae { from { transform: translateY(-40px) scale(.4); opacity: 0; } }
@keyframes brilla { from { transform: scale(1); } to { transform: scale(1.12); } }
.marcador { font-variant-numeric: tabular-nums; }
.opciones { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 6px 0 12px; }
.opciones button { min-height: 52px; min-width: 64px; padding: 6px 14px; border-radius: 16px; background: #eef6fb; font-weight: 800; font-size: 17px; box-shadow: 0 4px 0 var(--shadow); }
.opciones button.on { background: var(--gold, #ffd23f); }
.opciones button small { display: block; font-weight: 600; font-size: 12px; color: #5b6b82; }
.portada-caja h2 { font: 800 18px var(--font-display); margin: 10px 0 2px; color: #5b6b82; }
.fin { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(35,50,74,.35); padding: 16px; }
.fin-caja { background: #fff; border-radius: 26px; padding: 22px 26px; text-align: center; box-shadow: 0 10px 0 rgba(0,0,0,.15); max-width: 360px; }
.fin-caja .grande { font-size: 64px; line-height: 1; }
.fin-caja h2 { font: 800 28px var(--font-display); margin: 8px 0; }
.fin-caja .acciones { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
.fin-caja button { min-height: 54px; padding: 8px 18px; border-radius: 18px; font-weight: 800; font-size: 18px; background: #eef6fb; box-shadow: 0 4px 0 var(--shadow); }
.fin-caja button.go { background: var(--go, #4cb87a); color: #fff; }
@media (prefers-reduced-motion: reduce) { .ficha, .ficha.gana { animation: none; } }
</style>
<script src="js/comun.js"></script>
<script src="js/tema.js"></script>
</head>
<body>
<div class="hud">
  <div class="hud-side">
    <a class="round-btn btn" href="index.html" aria-label="Volver al inicio">🏠</a>
    <div class="pill marcador" aria-label="Marcador" id="marcador">0 – 0</div>
  </div>
  <div class="hud-side">
    <button class="round-btn" data-musica aria-label="Música">🎵</button>
    <div class="pill" id="jugador"></div>
  </div>
</div>
<div class="vez" id="turno" hidden></div>
<div class="zona"><div class="tablero" id="tablero" aria-label="Tablero"></div></div>
<div id="mensaje" aria-live="polite"></div>

<div class="portada" id="portada">
  <div class="portada-caja">
    <div style="font-size:56px;line-height:1">☀️🌙☀️</div>
    <h1>En Raya</h1>
    <p>Pon tus fichas en una fila, columna o diagonal. ¡Escucha lo que dice cada ficha!</p>
    <h2>Juego</h2>
    <div class="opciones" id="op-juego"></div>
    <h2>Fichas</h2>
    <div class="opciones" id="op-fichas"></div>
    <h2>¿Con quién?</h2>
    <div class="opciones" id="op-modo"></div>
    <div class="opciones" id="op-nivel"></div>
    <button class="go" id="empezar" disabled>Cargando…</button>
  </div>
</div>
<script src="js/enraya.js"></script>
</body>
</html>
